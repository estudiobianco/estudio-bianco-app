<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tu proyecto · Estudio Bianco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEDE9;--az:#5B4A3E;--azl:#E8DED4;--azb:#CBBFAF;--surface:#fff;--s2:#F6F2EB;--tx:#3B3029;--tx2:#6F655C;--tx3:#A69C91;--bd:#E8DED4;--bd2:#CBBFAF;--ac:#5B4A3E;--acl:#E8DED4;--ok:#5B4A3E;--okl:#E8DED4;--wn:#8A8077;--wnl:#F6F2EB;--dn:#B4483C;--dnl:#F8E7E4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:20px;margin-bottom:22px;}
.logo{height:40px;display:block;margin-bottom:18px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--az);font-weight:700;margin-bottom:6px;}
h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:32px;line-height:1.1;}
.sub{color:var(--tx2);margin-top:6px;max-width:560px;}
.tot{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.tot .s{text-align:right;}
.tot .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);}
.tot .v{font-family:'Fraunces',Georgia,serif;font-size:26px;margin-top:2px;}
.tot .s{font-size:12px;color:var(--tx2);}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.chip{border:1px solid var(--bd);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--tx);font-family:inherit;}
.chip i{font-style:normal;color:var(--tx3);margin-left:5px;}
.chip.on{background:var(--az);border-color:var(--az);color:#fff;}.chip.on i{color:rgba(255,255,255,.75);}
.sp{flex:1;}
select.ag{border:1px solid var(--bd);background:var(--surface);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--tx);}
h2{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:21px;margin:26px 0 12px;display:flex;gap:10px;align-items:baseline;}
h2 small{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--tx3);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.card.alt{opacity:.92;}
.ph{height:220px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:12px;position:relative;}
.ph img{width:100%;height:100%;object-fit:contain;padding:10px;background:#fff;}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--surface);border:1px solid var(--bd);}
.b-Aprobado{background:var(--okl);color:var(--ok);border-color:#CBBFAF;}
.b-Cambios{background:var(--wnl);color:var(--wn);border-color:#CBBFAF;}
.b-Rechazado{background:var(--dnl);color:var(--dn);border-color:#EEC5BE;}
.b-Por{background:var(--surface);color:var(--tx2);}
.bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.opn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--az);}
.card.alt .opn{color:var(--tx3);}
.nm{font-weight:700;font-size:15px;line-height:1.3;}
.meta{font-size:12.5px;color:var(--tx2);}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px;}
.pr .u{font-size:12.5px;color:var(--tx2);}
.pr .t{font-weight:700;font-size:15px;}
.card.alt .pr .t{color:var(--tx3);}
.specs{font-size:12px;color:var(--tx2);white-space:pre-line;background:#F6F2EB;border-radius:8px;padding:8px 10px;max-height:7.5em;overflow:hidden;position:relative;cursor:pointer;}
.specs.open{max-height:none;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;}
.ent{border-radius:99px;padding:2px 9px;background:var(--s2);color:var(--tx2);}
.ent.ok{background:var(--okl);color:var(--ok);}
a.tienda{color:var(--az);font-weight:500;text-decoration:none;font-size:12.5px;}
a.tienda:hover{text-decoration:underline;}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap;}
.acts button{flex:1;min-width:84px;border:1px solid var(--bd2);background:var(--surface);border-radius:10px;padding:9px 6px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--tx);}
.acts button:hover{border-color:var(--az);}
.acts .ap.on{background:var(--ok);border-color:var(--ok);color:#fff;}
.acts .ca.on{background:var(--wn);border-color:var(--wn);color:#fff;}
.acts .re.on{background:var(--dn);border-color:var(--dn);color:#fff;}
.coms{border-top:1px solid var(--bd);padding:10px 16px;background:#FBF9F5;font-size:12.5px;}
.com{margin-bottom:6px;}.com b{font-weight:700;}.com .f{color:var(--tx3);font-size:11px;margin-left:4px;}
.addc{background:none;border:0;color:var(--tx2);font-size:12.5px;cursor:pointer;padding:0;font-family:inherit;text-decoration:underline;}
.grp{background:#FBF9F5;border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;}
.grp .gh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin:0 2px 12px;}
.grp .gh b{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:18px;}
.grp .gh span{font-size:12.5px;color:var(--tx2);}

.grp .card{border-color:var(--bd);}
.grp .card.sel{border:2px solid var(--az);}
.msg{text-align:center;padding:80px 20px;color:var(--tx2);}
.msg h1{margin-bottom:10px;}
.modal{position:fixed;inset:0;background:rgba(30,28,24,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal.open{display:flex;}
.box{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:22px;}
.box h3{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:21px;margin-bottom:4px;}
.box p{color:var(--tx2);font-size:13px;margin-bottom:12px;}
.box label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px;}
.box input,.box textarea{width:100%;border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--tx);}
.box textarea{min-height:96px;resize:vertical;}
.box .err{color:var(--dn);font-size:12.5px;margin-top:8px;display:none;}
.box .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.box .bt button{border:1px solid var(--bd2);background:var(--surface);border-radius:10px;padding:9px 16px;font-family:inherit;font-size:14px;cursor:pointer;}
.box .bt .p{background:var(--az);border-color:var(--az);color:#fff;font-weight:500;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;display:none;z-index:60;}
/* Intro */
.intro{margin-bottom:12px;}
.ins{background:var(--azl);border:1px solid var(--azb);border-radius:12px;padding:12px 16px;font-size:13px;color:#5B4A3E;}
.ins b{font-weight:700;}
.ins ol{margin:8px 0 0 18px;padding:0;}.ins li{margin-bottom:4px;}
.imp{background:#FDECEA;border:1px solid #F1B8B0;border-radius:12px;padding:12px 16px;font-size:13px;color:#9B2C1F;}
.imp b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
@media (max-width:760px){.intro{grid-template-columns:1fr;}}
.prog{flex-basis:100%;height:6px;background:#E8DED4;border-radius:99px;overflow:hidden;}
.prog div{height:100%;background:var(--az);border-radius:99px;transition:width .3s;}
.toast{align-items:center;gap:12px;}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;font-family:inherit;font-size:13px;cursor:pointer;}
.notab{align-self:flex-start;border:1px solid var(--azb);background:var(--azl);color:#5B4A3E;border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit;}
.nota{display:none;background:var(--azl);border-radius:8px;padding:8px 10px;font-size:12.5px;color:#5B4A3E;white-space:pre-line;}
.compra{font-size:12px;color:var(--ok);background:var(--okl);border-radius:8px;padding:6px 10px;}
.compra a{color:var(--ok);margin-left:4px;}
.lcy{align-self:flex-start;border:0;background:none;color:var(--tx2);font-size:12.5px;cursor:pointer;padding:0;font-family:inherit;text-decoration:underline;}
.fin{margin-top:30px;background:var(--azl);border:1px solid var(--azb);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:#5B4A3E;font-size:13.5px;}
.fin span{font-size:12.5px;}
.fin button{background:var(--az);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.res{max-height:50vh;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px;}
.res h4{font-size:13px;margin:10px 0 4px;}.res ul{margin:0 0 0 18px;}.res p{margin-bottom:6px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:0 0 16px;}
.tabs button{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--tx2);cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs button.on{color:var(--az);border-bottom-color:var(--az);font-weight:500;}
.tabs i{font-style:normal;font-size:12px;color:var(--tx3);}
.card.prov .pc{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:6px;}
.card.prov .pc a{color:var(--az);text-decoration:none;}
.card.prov .pc a:hover{text-decoration:underline;}
/* Exclusividad */
.priv{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--tx3);border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:22px;}
footer b{color:var(--tx2);font-weight:700;}
/* Barra flotante */
#flot{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(680px,calc(100vw - 24px));background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:0 10px 30px rgba(20,30,40,.14);padding:10px 12px 10px 18px;display:none;align-items:center;gap:14px;z-index:40;}
#flot.on{display:flex;}
#flot .fl-av{flex:1;min-width:0;font-size:13px;color:var(--tx2);}
#flot .fl-av .prog{margin-top:6px;}
#flot button{background:var(--az);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;}
.wrap{padding-bottom:120px;}
/* Pestañas en celular */
.tabs{overflow-x:auto;scrollbar-width:none;}.tabs button{white-space:nowrap;}
/* Láminas y renders */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
.dph{height:300px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:center;position:relative;cursor:zoom-in;}
.dph img{width:100%;height:100%;object-fit:contain;padding:10px;}
.dph .zoom{position:absolute;right:10px;bottom:10px;font-size:11.5px;background:rgba(255,255,255,.92);border:1px solid var(--bd);border-radius:99px;padding:3px 10px;color:var(--tx2);}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
@media (max-width:640px){.gal{grid-template-columns:1fr;}}
.g-t{position:relative;aspect-ratio:15/7;border-radius:10px;overflow:hidden;background:#2B241F;}
/* Formato de las imágenes: 15:7 (ej. 3000 x 1400 px). La foto se ve completa; si viene en otro formato, el espacio que sobra se rellena con la misma foto difuminada */
.g-t img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;transition:transform .5s ease;}
.g-bg{position:absolute;inset:-24px;background-position:center;background-size:cover;filter:blur(20px) brightness(.75);}
.g-est,.g-ab,.g-pie{z-index:2;}
.g-t:hover img{transform:scale(1.03);}
.g-pdf{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5B4A3E;font-size:13px;cursor:pointer;}
.g-pdf b{font-size:34px;letter-spacing:.05em;}
.g-est{position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;color:#fff;background:#5B4A3E;}
.g-est.no{background:#B4483C;}.g-est.ca{background:#8EC3E6;color:#2B3A44;}
.g-ab{position:absolute;right:10px;top:10px;display:flex;gap:6px;}
.g-ab button,.g-cm{border:0;border-radius:6px;padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;background:rgba(255,255,255,.9);color:#3A2F27;backdrop-filter:blur(4px);}
.g-ab button:hover,.g-cm:hover{background:#fff;}
.g-ab .g-ap.on{background:#5B4A3E;color:#fff;}
.g-ab .g-re.on{background:#B4483C;color:#fff;}
.g-pie{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:40px 12px 11px;background:linear-gradient(to top,rgba(30,24,20,.72),rgba(30,24,20,0));color:#fff;}
.g-tx{min-width:0;width:100%;cursor:zoom-in;}
.g-tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g-tx span{display:block;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g-cm{flex-shrink:0;white-space:nowrap;}
@media (max-width:560px){.g-cm{font-size:11px;padding:6px 8px;}}
#visor .vc{flex-direction:column;gap:12px;}
.vinfo{width:100%;max-width:760px;max-height:30vh;overflow:auto;background:#fff;border-radius:10px;padding:12px 14px;font-size:13px;color:#3A2F27;}
.vinfo .vi-n b{display:block;font-size:12px;margin-bottom:2px;}
.vinfo .vi-n,.vinfo .vi-v{margin-bottom:8px;}
.vinfo .vi-c{border-top:1px solid #EEE7DF;padding:6px 0;}
.vinfo .vi-c span{color:#8A8077;font-size:11.5px;}
.pdfi{text-align:center;color:var(--tx2);font-size:13px;}.pdfi b{display:block;font-size:34px;color:#B4483C;letter-spacing:.05em;}
#visor{position:fixed;inset:0;background:rgba(15,18,22,.88);display:none;flex-direction:column;z-index:70;}
#visor.open{display:flex;}
#visor .vbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;color:#fff;font-size:14px;}
#visor .vbar a{color:#CBBFAF;}
#visor .vbar button{background:#fff;border:0;border-radius:99px;width:34px;height:34px;font-size:15px;cursor:pointer;}
#visor .vc{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px 16px;min-height:0;}
#visor img{max-width:100%;max-height:100%;min-height:0;object-fit:contain;background:#fff;border-radius:6px;}
#visor iframe{width:100%;flex:1;min-height:0;border:0;background:#fff;border-radius:6px;}
/* Proveedores en acordeón */
.acc{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff;}
.acc-i+.acc-i{border-top:1px solid var(--bd);}
.acc-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:14px 18px;cursor:pointer;font-family:inherit;text-align:left;color:var(--tx);}
.acc-h:hover{background:#FBF9F5;}
.acc-h b{font-weight:700;font-size:14.5px;display:block;}
.acc-h small{font-size:12px;color:var(--tx3);}
.acc-h .chev{color:var(--tx3);font-size:18px;transition:transform .2s;}
.acc-i.open .chev{transform:rotate(180deg);color:var(--az);}
.acc-b{display:none;padding:0 18px 14px;flex-direction:column;gap:5px;font-size:13.5px;}
.acc-i.open .acc-b{display:flex;}
.acc-b a{color:var(--az);text-decoration:none;}.acc-b a:hover{text-decoration:underline;}
@media (max-width:600px){.dgrid{grid-template-columns:1fr;}.dph{height:240px;}#flot{padding:10px 10px 10px 14px;}#flot button{padding:10px 12px;font-size:13px;}}
/* Grupos de opciones y recomendada */
.grp{border:1px solid var(--azb);box-shadow:inset 4px 0 0 var(--az);}
.grp .gh>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ng{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--az);border-radius:99px;padding:3px 10px;}
.grec{color:#5B4A3E;font-weight:700;}
.grp .gh .ng{color:#fff;font-size:10.5px;}.grp .gh .grec{color:#5B4A3E;font-size:12.5px;}
.recb{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;border-radius:99px;padding:4px 10px;background:#F6F2EB;color:#5B4A3E;border:1px solid #CBBFAF;}
.card.rec{box-shadow:0 0 0 1px #CBBFAF;}
/* Bienvenida */
.bienv{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;}
.bienv label{font-size:13px;color:var(--tx2);margin-bottom:6px;text-align:center;}
.bienv .err{text-align:center;}
/* Entrada animada (≈1 s, versión restaurada 16-10-2026): líneas que se dibujan desde el centro y contenido que sube en cascada */
.bienv .priv span{position:relative;padding:0 16px;}
.bienv .priv span::before,.bienv .priv span::after{content:'';position:absolute;top:50%;width:min(90px,18vw);height:1px;background:#5B4A3E;transform:scaleX(0);animation:ebLinea .9s cubic-bezier(.65,0,.35,1) .1s forwards;}
.bienv .priv span::before{right:100%;transform-origin:right center;}
.bienv .priv span::after{left:100%;transform-origin:left center;}
.bienv .ln{height:1px;background:#5B4A3E;width:56px;margin:0 auto 22px;transform:scaleX(0);animation:ebLinea .7s cubic-bezier(.65,0,.35,1) .3s forwards;}
.bienv>*{opacity:0;transform:translateY(10px);animation:ebSube .5s cubic-bezier(.2,.7,.2,1) forwards;}
.bienv>.priv{transform:none;animation-name:ebAparece;animation-delay:0s;}
.bienv>*:nth-child(2){animation-delay:.08s;}.bienv>*:nth-child(3){animation-delay:.14s;}.bienv>*:nth-child(4){animation-delay:.2s;}
.bienv>*:nth-child(5){animation-delay:.26s;}.bienv>*:nth-child(6){animation-delay:.32s;}.bienv>*:nth-child(7){animation-delay:.38s;}
.bienv>*:nth-child(8){animation-delay:.42s;}.bienv>*:nth-child(9){animation-delay:.46s;}.bienv>*:nth-child(10){animation-delay:.5s;}.bienv>*:nth-child(n+11){animation-delay:.5s;}
.bienv>.err{animation:none;opacity:1;transform:none;}
.bienv>.ln{opacity:1;}
@keyframes ebLinea{to{transform:scaleX(1);}}
@keyframes ebSube{to{opacity:1;transform:none;}}
@keyframes ebAparece{to{opacity:1;}}
@media (prefers-reduced-motion:reduce){.bienv>*,.bienv .ln,.bienv .priv span::before,.bienv .priv span::after{animation:none!important;opacity:1!important;transform:none!important;}}
.bienv input{text-align:center;}
.bienv input{border:1px solid var(--bd2);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--tx);}
.bienv input:focus{outline:none;border-color:#5B4A3E;}
.bienv button:hover{background:#45382E;}
.bienv button{margin-top:12px;background:#5B4A3E;color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;}
.bienv p{font-size:12px;color:var(--tx3);text-align:center;margin-top:14px;}
.bienv .err{color:var(--dn);font-size:12.5px;margin-top:6px;display:none;}
footer{margin-top:40px;color:var(--tx3);font-size:12px;text-align:center;}
/* Resumen de pagos arriba del listado */
.tot3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:16px 18px 14px;margin-bottom:10px;}

<body>
<div class="wrap" id="app"><div class="msg">Cargando tu proyecto…</div></div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mT"></h3><p id="mP"></p>
  <label for="mNom" id="mNL">Tu nombre</label><input id="mNom" maxlength="80" placeholder="Ej: Jorge">
  <label for="mCom" id="mCL">Comentario</label><textarea id="mCom" maxlength="2000" placeholder="Escribe aquí…"></textarea>
  <div class="err" id="mErr"></div>
  <div class="bt"><button onclick="cerrar()">Cancelar</button><button class="p" id="mOk" onclick="enviar()">Enviar</button></div>
</div></div>
<div class="modal" id="resOv"><div class="box"><div class="cuerpo"></div><div class="bt"><button onclick="ebCerrarRes()">Cerrar</button><button class="p" onclick="ebGuardarResumen()">Guardar o imprimir</button></div></div></div>
<div class="modal" id="compOv"><div class="box cuerpo"></div></div>
<div id="flot"></div>
<div id="visor" onclick="if(event.target===this)ebCerrarVisor()"><div class="vbar"><span class="vt"></span><button onclick="ebCerrarVisor()">✕</button></div><div class="vc"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var QS=new URLSearchParams(location.search), K=QS.get('k')||'';
  // Link con nombre (clientes.estudiobianco.cl/tulio-pulgar o ?s=tulio-pulgar) + clave de 4 números que da el estudio
  var S=String(QS.get('s')||location.pathname.replace(/^\/+|\/+$/g,'')).toLowerCase(); if(K||!/^[a-z0-9][a-z0-9-]{2,60}$/.test(S))S='';
  var PIN=''; try{PIN=S?(localStorage.getItem('ebc_pin_'+S)||''):'';}catch(e){}
  function cred(){return K?{k:K}:{s:S,pin:PIN};}
  function leer(){return fetch('/api/cliente?'+(K?'k='+encodeURIComponent(K):'s='+encodeURIComponent(S)),{headers:K?{}:{'x-clave':PIN}});}
  var D=null, filtro='', agrupar='esp', pend=null;
  // Siempre parte viendo por espacio (no se recuerda la vista por categoría)
  try{localStorage.removeItem('ebc_agrupar');}catch(e){}
  var vista='compras'; try{var _v=localStorage.getItem('ebc_vista');if(['prov','lamina','render','avance'].indexOf(_v)>=0)vista=_v;}catch(e){}
  function e(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function m(n){return '$'+Math.round(n).toLocaleString('es-CL');}
  function fuera(it){return it.grupo&&!it.elegida;}
  function sub(it){return (+it.cant||1)*(+it.precio||0)+(+it.despacho||0);} // incluye despacho
  function urlOk(u){return /^https?:\/\//i.test(String(u||'').trim());}
  function est(it){return it.estado||'Por revisar';}
  // Aviso abajo; si trae una accion, muestra "Deshacer" por 6 segundos
  function toast(t,deshacer){
    var x=document.getElementById('toast'); x.innerHTML=''; var s=document.createElement('span'); s.textContent=t; x.appendChild(s);
    if(deshacer){var b=document.createElement('button');b.textContent='Deshacer';b.onclick=function(){x.style.display='none';deshacer();};x.appendChild(b);}
    x.style.display='flex'; clearTimeout(x._t); x._t=setTimeout(function(){x.style.display='none';},deshacer?6000:2600);
  }

  function cargar(){
    if(!S&&!/^[A-Za-z0-9_-]{20,64}$/.test(K)){mensaje('Link incompleto','Revisa que copiaste el link completo que te envió Estudio Bianco.');return;}
    leer().then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      if(x.j&&(x.j.pin||x.j.bloqueado)){if(PIN&&x.j.pin){PIN='';try{localStorage.removeItem('ebc_pin_'+S);}catch(e){}}pedirClave(x.j.error||'',!!x.j.bloqueado);return;}
      if(!x.ok||!x.j.ok){mensaje('No pudimos abrir el proyecto',x.j.error||'Intenta de nuevo en un momento.');return;}
      D=normalizar(x.j);if(miNombre()){pintar();registrarVisita();}else bienvenida();})
    .catch(function(){mensaje('Sin conexión','Revisa tu internet e intenta de nuevo.');});
  }
  // Clave de 4 números (solo en el link con nombre). Se recuerda en este equipo.
  function pedirClave(err,bloq){
    document.getElementById('app').innerHTML='<div class="bienv"><div class="priv" style="border:0;justify-content:center;margin-bottom:28px;"><span>Plataforma privada · Estudio Bianco®</span></div>'
      +'<img class="logo" src="/logo-estudio-bianco-t.png" alt="Estudio Bianco®" style="margin:0 auto 18px;"><div class="ln"></div><div class="eyebrow" style="text-align:center;">Tu proyecto</div>'
      +'<h1 style="text-align:center;margin-bottom:8px;">¡Te damos la bienvenida a tu portal de cliente!</h1>'
      +'<p style="text-align:center;color:var(--tx2);font-size:15px;margin:0 0 22px;">Nos alegra verte acá.</p>'
      +'<label for="bPin">Clave de 4 números que te dio Estudio Bianco</label><input id="bPin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••" style="text-align:center;letter-spacing:.5em;font-size:22px;"'+(bloq?' disabled':'')+' onkeydown="if(event.key===\'Enter\')ebClave()">'
      +'<div class="err" id="bErr"'+(err?' style="display:block;"':'')+'>'+e(err)+'</div><button onclick="ebClave()"'+(bloq?' disabled style="opacity:.5;"':'')+'>Entrar</button>'
      +'<p>Si no tienes la clave, pídesela a Estudio Bianco.</p></div>';
    setTimeout(function(){var i=document.getElementById('bPin');if(i&&!bloq)i.focus();},50);
  }
  window.ebClave=function(){
    var v=(document.getElementById('bPin').value||'').replace(/\D/g,'');
    if(v.length!==4){var er=document.getElementById('bErr');er.textContent='La clave tiene 4 números.';er.style.display='block';return;}
    PIN=v; try{localStorage.setItem('ebc_pin_'+S,v);}catch(x){} cargar();
  };
  // Bienvenida: el nombre se pide una sola vez al entrar y queda constancia de cada ingreso
  function bienvenida(){
    document.getElementById('app').innerHTML='<div class="bienv"><div class="priv" style="border:0;justify-content:center;margin-bottom:28px;"><span>Plataforma privada · Estudio Bianco®</span></div>'
      +'<img class="logo" src="/logo-estudio-bianco-t.png" alt="Estudio Bianco®" style="margin:0 auto 18px;"><div class="ln"></div><div class="eyebrow" style="text-align:center;">Te damos la bienvenida</div>'
      +'<h1 style="text-align:center;margin-bottom:18px;">'+e(D.proyecto.nombre)+'</h1>'
      +'<label for="bNom">¿Cómo te llamas?</label><input id="bNom" maxlength="80" placeholder="Tu nombre" autocomplete="given-name" onkeydown="if(event.key===\'Enter\')ebEntrar()">'
      +'<div class="err" id="bErr">Escribe tu nombre para entrar.</div><button onclick="ebEntrar()">Entrar</button>'
      +'<p>Lo pedimos solo esta vez, para que el estudio sepa quién revisa el proyecto.</p></div>';
    setTimeout(function(){var i=document.getElementById('bNom');if(i)i.focus();},50);
  }
  window.ebEntrar=function(){
    var n=document.getElementById('bNom').value.trim(); if(!n){document.getElementById('bErr').style.display='block';return;}
    try{localStorage.setItem('ebc_nombre',n);}catch(x){}
    pintar(); window.scrollTo(0,0); registrarVisita();
  };
  function registrarVisita(){
    var k='ebc_vis_'+(K||S); try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');}catch(x){}
    post({accion:'visita',nombre:miNombre()}).catch(function(){});
  }
  // Productos, proveedores, espacios y grupos con mayúscula solo al inicio ("Mesa lateral leblon")
  function cap(s){s=String(s==null?'':s).trim();if(!s)return s;var l=s.toLocaleLowerCase('es');return l.charAt(0).toLocaleUpperCase('es')+l.slice(1);}
  function normalizar(d){(d.items||[]).forEach(function(it){it.item=cap(it.item);it.proveedor=cap(it.proveedor);it.espacio=cap(it.espacio);it.grupo=cap(it.grupo);});(d.proveedores||[]).forEach(function(p){p.nombre=cap(p.nombre);});return d;}
  function mensaje(t,p){document.getElementById('app').innerHTML='<div class="msg"><img class="logo" src="/logo-estudio-bianco-t.png" alt="Estudio Bianco" style="margin:0 auto 24px;"><h1>'+e(t)+'</h1><p>'+e(p)+'</p></div>';}

  function pintar(){
    var its=D.items, sumable=function(it){return !fuera(it)&&est(it)!=='Rechazado';};
    var total=its.reduce(function(a,it){return a+(sumable(it)?sub(it):0);},0), pagado=its.reduce(function(a,it){return a+(sumable(it)?Math.min(+it.pagado||0,sub(it)):0);},0);
    var cuenta={'':its.length,'Por revisar':0,'Aprobado':0,'Cambios solicitados':0,'Rechazado':0};
    its.forEach(function(it){cuenta[est(it)]=(cuenta[est(it)]||0)+1;});
    var porCotizar=its.some(function(it){return !fuera(it)&&!(+it.precio>0);});
    document.title=(D.proyecto.nombre||'Tu proyecto')+' · Estudio Bianco';
    var docs=D.documentos||[], nLam=docs.filter(function(d){return d.tipo==='lamina';}).length, nRen=docs.filter(function(d){return d.tipo==='render';}).length, nProv=(D.proveedores||[]).length;
    if((vista==='lamina'&&!nLam)||(vista==='render'&&!nRen)||(vista==='prov'&&!nProv))vista='compras';
    if(vista==='avance'&&!D.seguimiento)vista='compras';
    var h='<div class="priv"><span>Plataforma privada</span><span>Estudio Bianco®</span></div>'
      +'<header><div><img class="logo" src="/logo-estudio-bianco-t.png" alt="Estudio Bianco®"><h1>'+e(D.proyecto.nombre)+'</h1>'
      +'<p class="sub">Esta aplicación es de desarrollo exclusivo de Estudio Bianco, una herramienta para administrar tu proyecto. Aquí armamos tu listado de compras y revisamos contigo cada producto antes de pagarlo.</p></div></header>';
    function tab(v,t,n){return '<button class="'+(vista===v?'on':'')+'" onclick="ebV(\''+v+'\')">'+t+(n!=null?' <i>'+n+'</i>':'')+'</button>';}
    h+='<div class="tabs">'+tab('compras','Listado de compras')+(D.seguimiento?tab('avance','Cómo va tu proyecto'):'')+(nLam?tab('lamina','Planos y láminas',nLam):'')+(nRen?tab('render','Looks y renders',nRen):'')+(nProv?tab('prov','Proveedores',nProv):'')+'</div>';
    var pie='<footer><b>Estudio Bianco®</b> · Plataforma de gestión de proyectos de diseño y desarrollo exclusivo de Estudio Bianco.<br>Estudio Bianco es una marca registrada. Este contenido es confidencial y de uso exclusivo del cliente; prohibida su reproducción total o parcial.</footer>';
    if(vista==='avance'){h+=htmlAvance()+pie;document.getElementById('app').innerHTML=h;barra(false);return;}
    if(vista==='prov'){h+=htmlProveedores()+pie;document.getElementById('app').innerHTML=h;barra(false);return;}
    if(vista==='lamina'||vista==='render'){h+=htmlDocs(vista)+pie;document.getElementById('app').innerHTML=h;barra(false);return;}
    h+='<div class="intro"><div class="imp"><b>Importante</b>Este listado puede estar incompleto: se va ajustando según nuestras reuniones. Aun así, es una aproximación fiel al presupuesto total.</div></div>';
    var revisados=its.length-(cuenta['Por revisar']||0), pct=its.length?Math.round(revisados/its.length*100):0, nom=miNombre();
    var pctP=total>0?Math.round(pagado/total*100):0;
    h+='<div class="tot3"><div><div class="l">Presupuesto total</div><div class="v">'+m(total)+'</div></div><div><div class="l">Pagado</div><div class="v ok">'+m(pagado)+'</div></div><div><div class="l">Por pagar</div><div class="v">'+m(Math.max(0,total-pagado))+'</div></div><div class="prog" title="'+pctP+'% pagado"><div style="width:'+pctP+'%;background:var(--ok);"></div></div></div>';
    h+='<div class="tot" style="padding:10px 16px;"><div class="s" style="text-align:left;">'+cuenta['Aprobado']+' de '+its.length+' productos aprobados'+(porCotizar?' · algunos productos están por cotizar':'')
      +(nom?'<br><span style="color:var(--tx3);">Respondiendo como '+e(nom)+' · <a href="#" onclick="ebCambiarNombre();return false;" style="color:var(--az);">cambiar</a></span>':'')+'</div></div>';
    // "Todos" no muestra lo descartado: los descartados se ven solo en su filtro
    cuenta['']=its.length-(cuenta['Rechazado']||0);
    var F=[['','Todos'],['Por revisar','Por revisar'],['Aprobado','Aprobados'],['Cambios solicitados','Con cambios'],['Rechazado','Descartados']];
    h+='<div class="bar">'+F.map(function(f){return '<button class="chip'+(filtro===f[0]?' on':'')+(f[0]==='Rechazado'?' chip-desc':'')+'" onclick="ebF(\''+f[0]+'\')">'+(f[0]==='Rechazado'?'Ver descartados':f[1])+'<i>'+(cuenta[f[0]]||0)+'</i></button>';}).join('')
      +'<span class="sp"></span><select class="ag" onchange="ebA(this.value)"><option value="esp"'+(agrupar==='esp'?' selected':'')+'>Ver por espacio</option><option value="cat"'+(agrupar==='cat'?' selected':'')+'>Ver por categoría</option></select></div>';
    var lista=its.filter(function(it){return filtro?est(it)===filtro:est(it)!=='Rechazado';});
    if(filtro==='Rechazado'&&lista.length)h+='<p class="meta" style="margin:0 0 10px;">Estos son los productos que descartaste. Si cambias de opinión, toca "Aprobar" o vuelve a tocar "Descartar" para que queden por revisar.</p>';
    if(!lista.length)h+='<div class="msg" style="padding:40px;">No hay productos en este filtro.</div>';
    var secs={}, orden=[];
    var nomEsp={}; its.forEach(function(it){var s=String(it.espacio||'').trim().replace(/\s+/g,' ');if(!s)return;var k=s.toLowerCase();if(!nomEsp[k]||(s[0]===s[0].toUpperCase()&&nomEsp[k][0]!==nomEsp[k][0].toUpperCase()))nomEsp[k]=s;});
    // El arte va siempre en su propia sección al final (también en la vista por espacio)
    lista.forEach(function(it){var s=it.cat==='Arte'?'Arte':agrupar==='esp'?(nomEsp[String(it.espacio||'').trim().replace(/\s+/g,' ').toLowerCase()]||'Otros'):(it.cat||'Otros');if(!secs[s]){secs[s]=[];orden.push(s);}secs[s].push(it);});
    if(agrupar==='esp')orden.sort(function(a,b){return (a==='Otros')-(b==='Otros')||a.localeCompare(b,'es');});
    orden.sort(function(a,b){return (a==='Arte')-(b==='Arte');});
    orden.forEach(function(s){
      var arr=secs[s];
      h+='<h2 class="sec-t">'+e(s)+'<small>'+arr.length+' producto'+(arr.length===1?'':'s')+'</small></h2>';
      var sueltos=[], hechos={}, bloques=[];
      arr.forEach(function(it){
        if(!it.grupo){bloques.push({tipo:'s',it:it});return;}
        if(hechos[it.grupo])return; hechos[it.grupo]=1;
        bloques.push({tipo:'g',g:it.grupo,its:arr.filter(function(x){return x.grupo===it.grupo;})});
      });
      var buf=[];
      function vaciar(){if(buf.length){h+='<div class="grid">'+buf.join('')+'</div>';buf=[];}}
      bloques.forEach(function(b){
        if(b.tipo==='s'){buf.push(tarjeta(b.it));return;}
        vaciar();
        var todos=its.filter(function(x){return x.grupo===b.g;});
        var rec=todos.find(function(x){return x.recomendada;});
        var nVis=b.its.length;
        h+='<div class="grp"><div class="gh2"><span class="ng">'+nVis+' opci'+(nVis===1?'ón':'ones')+'</span><span class="gsep"></span><b class="gt">'+e(b.g)+'</b><span class="gsub">Elige una'+(rec?' · <b><span class="st">★</span> Te recomendamos la Opción '+(todos.indexOf(rec)+1)+'</b>':'')+' · el total incluye la que tiene el borde celeste.</span></div><div class="grid g-op">'
          +b.its.map(function(it){return tarjeta(it,todos.indexOf(it)+1);}).join('')+'</div></div>';
      });
      vaciar();
    });
    h+=pie;
    document.getElementById('app').innerHTML=h;
    barra(true,revisados,its.length,pct);
    refrescarPanel();
  }
  // Barra flotante abajo: avance y "Terminé de revisar" (siempre a mano mientras revisa)
  function barra(ver,rev,tot,pct){
    var b=document.getElementById('flot'); if(!b)return;
    if(!ver){b.classList.remove('on');return;}
    b.innerHTML='<div class="fl-av"><span>Has revisado <b>'+rev+' de '+tot+'</b></span><div class="prog"><div style="width:'+pct+'%;"></div></div></div><button id="finBtn" onclick="ebFin()">Terminé de revisar</button>';
    b.classList.add('on');
  }
  // Láminas o renders para aprobar

      if(!j.ok){err.textContent=j.error||'No se pudo guardar.';err.style.display='block';return;}
      var it=D.items.find(function(x){return x.id===id;}); if(it){it.compra={fecha:f,entrega:en,orden:o,por:'cliente'};it.entrega='Pedido confirmado';if(pr>0)it.precio=pr;if(dp>0)it.despacho=dp;}
      ebCerrarComp(); pintar(); toast('✓ Compra registrada. ¡Gracias!'); refrescar();
    }).catch(function(){b.disabled=false;b.textContent='Guardar';err.textContent='Sin conexión. Intenta de nuevo.';err.style.display='block';});
  };
  function fechaCorta(d){if(!d)return '';var p=String(d).split('-');return p.length===3?(+p[2])+'/'+(+p[1])+'/'+p[0]:d;}
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){cerrar();ebCerrarVisor();}});
  cargar();
})();
</script>
