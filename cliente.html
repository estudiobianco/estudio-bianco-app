<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tu proyecto · Estudio Bianco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ══ Portal del cliente · sistema visual calmo (2-11-2026), el mismo de las pantallas "Hoy" y "Proyecto" de la app ══
   Fondo claro, tarjetas blancas redondeadas con sombra suave, Poppins en títulos y Open Sans en texto,
   pastillas redondeadas para los estados, poco texto a la vista y el detalle plegado hasta que se toca.
   El color de acento (--ac) es el color del proyecto; si no viene, el verde del estudio. */
:root{--bg:#F6F5F1;--card:#FFFFFF;--card2:#FBFAF7;--ink:#2A2C29;--ink2:#72756F;--ink3:#A4A69F;--line:#ECEAE4;
  --ac:#2A5C45;--acs:rgba(42,92,69,.12);--rojo:#D9534A;--ambar:#D9962B;--verde:#4CA36A;--rs:#FBE9E7;--as:#FBF0DC;--vs:#E4F3E9;--gs:#EFEFEC;
  --cel:#8EC3E6;--cels:#E4F1FA;--fd:'Poppins',system-ui,sans-serif;--fx:'Open Sans',system-ui,sans-serif;--r:20px;--r2:14px;
  --sh:0 2px 10px -4px rgba(42,44,41,.09),0 14px 30px -22px rgba(42,44,41,.16);
  /* nombres antiguos que todavía usa el código */
  --tx:var(--ink);--tx2:var(--ink2);--tx3:var(--ink3);--az:var(--ac);--bd:var(--line);--bd2:var(--line);--ok:var(--verde);--dn:var(--rojo);--surface:var(--card);--s2:var(--card2);--azl:var(--acs);--azb:var(--line);--okl:var(--vs);--wn:var(--ambar);--wnl:var(--as);--dnl:var(--rs);--acl:var(--acs);}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--fx);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
h1,h2,h3,h4{font-family:var(--fd);font-weight:500;letter-spacing:-.01em;line-height:1.25;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--ac);}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 130px;}
/* Cabecera: logo chico y portada con el último render */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;}
.top .logo{height:30px;display:block;}
.top .priv-t{font:500 11px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);}
.portada{position:relative;border-radius:var(--r);overflow:hidden;background:var(--ac);aspect-ratio:15/6;max-height:300px;min-height:150px;box-shadow:var(--sh);}
/* Portada a todo el ancho de la pantalla; el texto queda alineado con el contenido */
.portada.ancha{width:100vw;margin-left:calc(50% - 50vw);border-radius:0;box-shadow:none;aspect-ratio:auto;height:clamp(190px,30vw,360px);max-height:none;}
.portada.ancha .texto{left:max(24px,calc(50vw - 520px));right:max(24px,calc(50vw - 520px));bottom:26px;}
.portada img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.portada .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.62));}
.portada .texto{position:absolute;left:24px;right:24px;bottom:18px;color:#fff;display:flex;flex-direction:column;gap:3px;}
.portada h1{font-size:clamp(24px,3.6vw,38px);font-weight:500;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.45);}
.portada .cli{font-size:14px;opacity:.92;text-shadow:0 1px 8px rgba(0,0,0,.45);}
.hola{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:16px 6px 14px;}
.hola h2{font-size:22px;font-weight:500;}
.hola span{font-size:13px;color:var(--ink3);}
.hola a{color:var(--ink2);}
.eyebrow{font:500 11px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;}
.sub{color:var(--ink2);font-size:14px;max-width:620px;}
/* Pestañas como pastillas */
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 4px 10px;margin:0 -4px 6px;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{position:relative;flex:none;white-space:nowrap;font:500 13px/1 var(--fd);padding:10px 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);color:var(--ink2);border:0;}
.tabs button.on{background:var(--ink);color:#fff;}
.tabs button i{font-style:normal;font-size:12px;color:var(--ink3);margin-left:4px;}
.tabs button.on i{color:rgba(255,255,255,.65);}
.tab-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--rojo);border:2px solid var(--bg);}
/* Aviso, números y filtros del listado */
.intro{margin-bottom:12px;}
.imp{background:var(--card2);border-left:4px solid var(--ambar);border-radius:var(--r2);padding:10px 14px;font-size:13px;color:var(--ink2);}
.imp b{font:600 11px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--ambar);margin-right:8px;}
.tot3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.tot3>div{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px 18px;min-width:0;}
.tot3 .l{font-size:12.5px;color:var(--ink2);}
.tot3 .v{font:500 24px/1.1 var(--fd);letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tot3 .v.ok{color:var(--verde);}
.tot3 .prog{grid-column:1/-1;}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;}
.prog div{height:100%;background:var(--ac);border-radius:999px;transition:width .3s;}
.tot{display:none;}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 18px;}
.chip{border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:8px 13px;font:500 13px/1 var(--fd);color:var(--ink2);}
.chip i{font-style:normal;color:var(--ink3);margin-left:5px;font-weight:400;}
.chip.on{background:var(--ink);color:#fff;}
.chip.on i{color:rgba(255,255,255,.65);}
.chip.chip-desc{background:transparent;box-shadow:none;border:1.5px dashed var(--line);}
.chip.chip-desc.on{background:var(--ink);border-color:var(--ink);}
.sp{flex:1;}
select.ag{border:0;background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:8px 12px;font:500 13px/1 var(--fd);color:var(--ink2);-webkit-appearance:none;appearance:none;padding-right:28px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2372756F' stroke-width='1.5' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;}
.meta{font-size:12.5px;color:var(--ink2);}
/* Secciones (espacios) */
h2.sec-t{font-size:20px;font-weight:600;margin:28px 6px 12px;display:flex;gap:10px;align-items:baseline;}
h2.sec-t small{font:400 12.5px/1 var(--fx);color:var(--ink3);}
h2.prov-t{font-size:17px;margin:22px 6px 10px;}
/* Tarjetas de productos */
/* Productos: caben solos según el ancho (5 en computador, 2 o 3 en celular) */
.grid,.grp .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;align-items:start;}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;min-width:0;}
.card.alt{opacity:.9;}
.ph{height:130px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:12px;position:relative;}
.ph img{width:100%;height:100%;object-fit:contain;padding:8px;background:#fff;}
.ph-click,.pn-ph.ph-click{cursor:pointer;}
.ph-hint{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.94);color:var(--ink2);font:500 10.5px/1 var(--fd);border-radius:999px;padding:5px 9px;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.bdgs{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;}
.badge{font:600 10.5px/1 var(--fd);border-radius:999px;padding:6px 9px;background:#fff;color:var(--ink2);box-shadow:0 1px 4px rgba(0,0,0,.08);white-space:nowrap;}
.b-Aprobado{background:var(--vs);color:#2E7D4C;}
.b-Cambios{background:var(--as);color:#9A6A16;}
.b-Rechazado{background:var(--gs);color:var(--ink2);}
.b-Por{background:#fff;color:var(--ink2);}
.badge.b-comprar{background:#EAF0F8;color:#3B5B86;}
.recb{font:600 10.5px/1 var(--fd);border-radius:999px;padding:6px 9px;background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.recb .st,.gsub b .st{color:#3B8FD0;}
.bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
.opn{font:500 10px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);}
.nm{font:600 13.5px/1.3 var(--fd);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.pr .u{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.pr .t{font:500 14px/1 var(--fd);white-space:nowrap;}
.card.alt .pr .t{color:var(--ink3);}
.cab{display:flex;flex-direction:column;gap:2px;}
.cab .nm{min-height:2.6em;}
.cab .esp{font-size:11.5px;color:var(--ink3);}
.cab .t{font:500 14px/1 var(--fd);}
.icos{display:flex;gap:4px;flex-wrap:wrap;min-height:22px;align-content:flex-start;}
.ic{font:500 10.5px/1 var(--fd);background:var(--gs);color:var(--ink2);border-radius:999px;padding:5px 8px;border:0;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.cmc .sm,.ic .sm{display:none;}
.ic.ok{background:var(--vs);color:#2E7D4C;}
.ic.en i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--verde);margin-right:5px;vertical-align:1px;}
.ic-nota{cursor:pointer;background:var(--cels)!important;color:#2B4A5E!important;}
.ic-nota u{text-underline-offset:2px;}
.specs{font-size:12.5px;color:var(--ink2);white-space:pre-line;background:var(--card2);border-radius:12px;padding:10px 12px;max-height:7.5em;overflow:hidden;cursor:pointer;line-height:1.5;}
.specs.open{max-height:none;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;}
.ent{border-radius:999px;padding:5px 9px;background:var(--gs);color:var(--ink2);font:500 11px/1 var(--fd);}
.ent.ok{background:var(--vs);color:#2E7D4C;}
a.tienda{color:var(--ac);font-weight:600;text-decoration:none;font-size:12.5px;}
a.tienda:hover{text-decoration:underline;}
.compra{font-size:12.5px;color:#2E7D4C;background:var(--vs);border-radius:12px;padding:8px 12px;}
.compra a{color:#2E7D4C;margin-left:4px;}
.lcy{align-self:flex-start;border:0;background:none;color:var(--ink2);font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:2px;}
/* Botones de cada producto: aprobar, descartar, comentar */
.acts{display:flex;gap:5px;margin-top:auto;padding-top:6px;flex-wrap:wrap;}
.acts button{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 4px;font:400 12px/1.2 var(--fd);color:var(--ink2);white-space:nowrap;transition:background .15s,border-color .15s;}
.acts button:hover{border-color:var(--ink3);color:var(--ink);}
/* Respuesta ya dada: suave, sin bloque de color fuerte */
.acts .ap.on,.acts button.dec-ok{background:#EEF5F0;border-color:#D3E6D9;color:var(--verde);}
.acts .re.on,.acts button.dec-no{background:var(--gs);border-color:var(--gs);color:var(--ink2);}
.acts button.dec-ok,.acts button.dec-no{flex:1 1 100%;font-weight:500;font-size:12.5px;padding:6px 6px;}
.acts button.dec-ok:hover,.acts button.dec-no:hover{opacity:.9;}
.acts .ca.on{background:var(--as);border-color:var(--as);color:#9A6A16;}
.acts2{margin-top:0;padding-top:6px;}
.cmc{width:100%;margin-top:4px;border:0;background:var(--card2);border-radius:999px;padding:9px 8px;font:500 12.5px/1.2 var(--fd);color:var(--ink2);}
.cmc:hover{background:var(--gs);}
.mas-b{margin-top:2px;border:0;background:none;width:100%;text-align:left;padding:8px 0 0;font:500 11.5px/1 var(--fd);color:var(--ink3);display:flex;justify-content:space-between;}
.mas-b span{font-size:14px;line-height:1;}
details.mas{margin-top:4px;border-top:1px solid var(--line);}
details.mas summary{cursor:pointer;font:500 12px/1 var(--fd);color:var(--ink2);padding:8px 0 2px;list-style:none;display:flex;justify-content:space-between;}
details.mas summary::-webkit-details-marker{display:none;}
.mas-c{display:flex;flex-direction:column;gap:6px;padding-top:6px;}
/* Comentarios plegados en la tarjeta */
details.cm-d{margin-top:6px;}
details.cm-d summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font:500 11.5px/1 var(--fd);color:var(--ink3);padding:6px 0;}
details.cm-d summary::-webkit-details-marker{display:none;}
details.cm-d summary::before{content:'';flex:1;height:1px;background:var(--line);order:2;}
details.cm-d summary::after{content:'';order:3;width:7px;height:7px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:rotate(45deg) translateY(-2px);}
details.cm-d[open] summary::after{transform:rotate(-135deg) translateY(-2px);}
details.cm-d summary i{font-style:normal;background:var(--gs);color:var(--ink2);border-radius:999px;padding:3px 7px;font-size:10.5px;}
.coms{font-size:12.5px;}
.card .coms{padding:0;}
.com{padding:6px 0;border-top:1px solid var(--line);}
.com:first-child{border-top:0;}
.com b{font-weight:600;}
.com .f{color:var(--ink3);font-size:11px;margin-left:4px;}
.cm-vacio{font-size:11.5px;color:var(--ink3);margin:2px 0 6px;}
.com-est{margin:8px 0 2px 10px;padding:8px 11px;border-left:3px solid var(--ac);background:var(--card2);border-radius:0 12px 12px 0;}
.com-est b{display:inline;font-size:12px;color:var(--ac);}
.com-est .f{margin-left:6px;}
.com-est div{margin-top:3px;}
.com-est.nueva{background:var(--cels);border-left-color:#5A9BC7;}
.av-resp{background:var(--cels);border-left:4px solid #5A9BC7;border-radius:var(--r2);padding:12px 14px;margin:0 0 12px;font-size:13px;color:#2B4A5E;}
.av-resp b{display:block;font:600 13.5px/1.3 var(--fd);margin-bottom:2px;}
.av-resp span{font-size:12px;}
.av-rb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.av-rb button{border:0;background:#fff;border-radius:999px;padding:7px 12px;font:500 12.5px/1 var(--fd);color:#2B4A5E;box-shadow:0 1px 4px rgba(0,0,0,.08);}
/* Grupos de opciones */
.grp{margin:18px 0 26px;}
.gh2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 6px 12px;}
.gh2 .ng{background:var(--ink);color:#fff;border-radius:999px;padding:6px 11px;font:500 11px/1 var(--fd);}
.gsep{display:none;}
.gt{font:600 17px/1.3 var(--fd);color:var(--ink);}
.gsub{font-size:12.5px;color:var(--ink2);flex-basis:100%;}
.gsub b{color:var(--ink);font-weight:600;}
.grid.g-op{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;}
.card.op .ph{height:130px;}
.card.op.alt{opacity:1;}
.card.op.sel{box-shadow:0 0 0 2px var(--cel),var(--sh);}
.card.rec{box-shadow:var(--sh);}
/* Mensajes, ventanas y avisos */
.msg{text-align:center;padding:80px 20px;color:var(--ink2);}
.msg h1{margin-bottom:10px;font-size:26px;}
.msg .logo{height:34px;}
.modal{position:fixed;inset:0;background:rgba(42,44,41,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:90;}
.modal.open{display:flex;}
.box{background:var(--card);border-radius:22px;max-width:460px;width:100%;padding:24px 24px 20px;box-shadow:0 24px 60px -20px rgba(42,44,41,.35);max-height:92vh;overflow:auto;}
.box h3{font-size:20px;font-weight:600;margin-bottom:4px;}
.box p{color:var(--ink2);font-size:13.5px;margin-bottom:12px;}
.box label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 5px;}
.box input,.box textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;font-size:15px;color:var(--ink);background:#fff;}
.box input:focus,.box textarea:focus{outline:none;border-color:var(--ac);}
.box textarea{min-height:96px;resize:vertical;}
.box .err{color:var(--rojo);font-size:12.5px;margin-top:8px;display:none;}
.box .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.box .bt button{border:0;background:var(--gs);border-radius:999px;padding:10px 18px;font:500 14px/1 var(--fd);color:var(--ink2);}
.box .bt .p{background:var(--ac);color:#fff;}
.box .bt .p:disabled{opacity:.6;}
.m-chk{display:flex!important;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin:10px 0 0;cursor:pointer;}
.m-chk input{width:16px;height:16px;accent-color:var(--ac);}
.res{max-height:50vh;overflow:auto;background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13px;}
.res h4{font-size:13px;margin:10px 0 4px;font-weight:600;}.res ul{margin:0 0 0 18px;}.res p{margin-bottom:6px;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:999px;font-size:13.5px;display:none;align-items:center;gap:12px;z-index:95;box-shadow:var(--sh);white-space:nowrap;max-width:calc(100vw - 24px);}
.toast span{overflow:hidden;text-overflow:ellipsis;}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:5px 11px;font:500 12.5px/1 var(--fd);}
/* Barra flotante abajo: avance de la revisión */
#flot{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));background:var(--card);border-radius:999px;box-shadow:0 10px 30px -8px rgba(42,44,41,.3);padding:10px 10px 10px 20px;display:none;align-items:center;gap:14px;z-index:40;}
#flot.on{display:flex;}
#flot .fl-av{flex:1;min-width:0;font-size:13px;color:var(--ink2);}
#flot .fl-av b{color:var(--ink);font-weight:600;}
#flot .fl-av .prog{margin-top:6px;}
#flot button{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:11px 18px;font:500 14px/1 var(--fd);white-space:nowrap;}
#flot button:disabled{opacity:.6;}
body.pn-open #flot{display:none!important;}
/* Aviso de novedades al entrar */
#novPop{position:fixed;inset:0;background:rgba(42,44,41,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:88;}
#novPop.open{display:flex;animation:npIn .25s ease;}
@keyframes npIn{from{opacity:0;}to{opacity:1;}}
#novPop .np-box{background:var(--card);border-radius:22px;width:min(440px,100%);padding:24px 22px 18px;box-shadow:0 24px 60px -20px rgba(42,44,41,.35);}
#novPop .np-h{display:flex;gap:12px;align-items:center;margin-bottom:12px;}
#novPop .np-bell{font-size:22px;width:44px;height:44px;border-radius:50%;background:var(--as);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#novPop .np-h b{display:block;font:600 18px/1.25 var(--fd);color:var(--ink);}
#novPop .np-h small{font-size:12.5px;color:var(--ink2);}
#novPop .np-f{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;}
#novPop .np-i{font-size:17px;width:24px;text-align:center;}
#novPop .np-t{flex:1;}
#novPop .np-f button{border:0;background:var(--gs);border-radius:999px;padding:7px 12px;font:500 12.5px/1 var(--fd);color:var(--ink);flex-shrink:0;}

/* Láminas y renders: galería 15:7 */
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.g-t{position:relative;aspect-ratio:15/7;border-radius:var(--r);overflow:hidden;background:#2B2D2A;box-shadow:var(--sh);}
.g-t img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;transition:transform .5s ease;}
.g-bg{position:absolute;inset:-24px;background-position:center;background-size:cover;filter:blur(20px) brightness(.75);}
.g-est,.g-ab,.g-pie{z-index:2;}
.g-t:hover img{transform:scale(1.03);}
.g-pdf{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:13px;cursor:pointer;gap:4px;}
.g-pdf b{font:600 30px/1 var(--fd);letter-spacing:.05em;}
.g-est{position:absolute;left:10px;top:10px;font:600 11px/1 var(--fd);padding:7px 10px;border-radius:999px;color:#2E7D4C;background:var(--vs);}
.g-est.no{background:var(--gs);color:var(--ink2);}.g-est.ca{background:var(--as);color:#9A6A16;}
.g-ab{position:absolute;right:10px;top:10px;display:flex;gap:6px;}
.g-ab button,.g-cm{border:0;border-radius:999px;padding:7px 11px;font:500 12px/1 var(--fd);background:rgba(255,255,255,.92);color:var(--ink);backdrop-filter:blur(4px);}
.g-ab button:hover,.g-cm:hover{background:#fff;}

.g-ab .g-re.on{background:var(--ink2);color:#fff;}
.g-pie{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:40px 12px 11px;background:linear-gradient(to top,rgba(20,22,20,.72),rgba(20,22,20,0));color:#fff;}
.g-tx{min-width:0;width:100%;cursor:zoom-in;}
.g-tx b{display:block;font:600 14px/1.3 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Proveedores en acordeón */
.acc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.acc-i+.acc-i{border-top:1px solid var(--line);}
.acc-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:14px 18px;text-align:left;color:var(--ink);}

/* Bienvenida y clave */
.priv{display:flex;justify-content:space-between;font:500 10.5px/1 var(--fd);letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);}
.bienv{max-width:440px;margin:6vh auto 0;display:flex;flex-direction:column;background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:34px 28px 28px;}
.bienv .logo{height:34px;}
.bienv h1{font-size:24px;font-weight:600;}
.bienv label{font-size:13px;color:var(--ink2);margin-bottom:8px;text-align:center;}
.bienv input{text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;color:var(--ink);background:#fff;}
.bienv input:focus{outline:none;border-color:var(--ac);}
.bienv button{margin-top:12px;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:14px;font:500 15px/1 var(--fd);}
.bienv button:hover{filter:brightness(.95);}
.bienv p{font-size:12.5px;color:var(--ink3);text-align:center;margin-top:14px;}
.bienv .err{color:var(--rojo);font-size:12.5px;margin-top:6px;display:none;text-align:center;}
/* Entrada animada (≈1 s): líneas que se dibujan desde el centro y contenido que sube en cascada */
.bienv .priv span{position:relative;padding:0 16px;}
.bienv .priv span::before,.bienv .priv span::after{content:'';position:absolute;top:50%;width:min(70px,14vw);height:1px;background:var(--line);transform:scaleX(0);animation:ebLinea .9s cubic-bezier(.65,0,.35,1) .1s forwards;}
.bienv .priv span::before{right:100%;transform-origin:right center;}
.bienv .priv span::after{left:100%;transform-origin:left center;}
.bienv .ln{height:1px;background:var(--line);width:56px;margin:0 auto 22px;transform:scaleX(0);animation:ebLinea .7s cubic-bezier(.65,0,.35,1) .3s forwards;}
.bienv>*{opacity:0;transform:translateY(10px);animation:ebSube .5s cubic-bezier(.2,.7,.2,1) forwards;}
.bienv>.priv{transform:none;animation-name:ebAparece;animation-delay:0s;}
.bienv>*:nth-child(2){animation-delay:.08s;}.bienv>*:nth-child(3){animation-delay:.14s;}.bienv>*:nth-child(4){animation-delay:.2s;}
.bienv>*:nth-child(5){animation-delay:.26s;}.bienv>*:nth-child(6){animation-delay:.32s;}.bienv>*:nth-child(7){animation-delay:.38s;}
.bienv>*:nth-child(8){animation-delay:.42s;}.bienv>*:nth-child(9){animation-delay:.46s;}.bienv>*:nth-child(10){animation-delay:.5s;}.bienv>*:nth-child(n+11){animation-delay:.5s;}
.bienv>.err{animation:none;opacity:1;transform:none;}
.bienv>.ln{opacity:1;}
@keyframes ebLinea{to{transform:scaleX(1);}}
@keyframes ebSube{to{opacity:1;transform:none;}}
@keyframes ebAparece{to{opacity:1;}}
@media (prefers-reduced-motion:reduce){.bienv>*,.bienv .ln,.bienv .priv span::before,.bienv .priv span::after{animation:none!important;opacity:1!important;transform:none!important;}}

<body>
<div class="wrap" id="app"><div class="msg">Cargando tu proyecto…</div></div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mT"></h3><p id="mP"></p>
  <label for="mNom" id="mNL">Tu nombre</label><input id="mNom" maxlength="80" placeholder="Ej: Jorge">
  <label for="mCom" id="mCL">Comentario</label><textarea id="mCom" maxlength="2000" placeholder="Escribe aquí…"></textarea>
  <label class="m-chk" id="mChkL" style="display:none;"><input type="checkbox" id="mCambio"> Es un cambio que necesito en este producto</label>
  <div class="err" id="mErr"></div>
  <div class="bt"><button onclick="cerrar()">Cancelar</button><button class="p" id="mOk" onclick="enviar()">Enviar</button></div>
</div></div>
<div class="modal" id="resOv"><div class="box"><div class="cuerpo"></div><div class="bt"><button onclick="ebCerrarRes()">Cerrar</button><button class="p" onclick="ebGuardarResumen()">Guardar o imprimir</button></div></div></div>
<div class="modal" id="compOv"><div class="box cuerpo"></div></div>
<div id="flot"></div>
<div id="visor" onclick="if(event.target===this)ebCerrarVisor()"><div class="vbar"><span class="vt"></span><button onclick="ebCerrarVisor()">✕</button></div><div class="vc"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var QS=new URLSearchParams(location.search), K=QS.get('k')||'';
  // Link con nombre (clientes.estudiobianco.cl/tulio-pulgar o ?s=tulio-pulgar) + clave de 4 números que da el estudio
  var S=String(QS.get('s')||location.pathname.replace(/^\/+|\/+$/g,'')).toLowerCase(); if(K||!/^[a-z0-9][a-z0-9-]{2,60}$/.test(S))S='';
  var PIN=''; try{PIN=S?(localStorage.getItem('ebc_pin_'+S)||''):'';}catch(e){}
  function cred(){return K?{k:K}:{s:S,pin:PIN};}
  function leer(){return fetch('/api/cliente?'+(K?'k='+encodeURIComponent(K):'s='+encodeURIComponent(S)),{headers:K?{}:{'x-clave':PIN}});}
  var D=null, filtro='', agrupar='esp', pend=null;
  // Siempre parte viendo por espacio (no se recuerda la vista por categoría)
  try{localStorage.removeItem('ebc_agrupar');}catch(e){}
  var vista='compras'; try{var _v=localStorage.getItem('ebc_vista');if(['prov','lamina','render','cotizacion','avance'].indexOf(_v)>=0)vista=_v;}catch(e){}
  function e(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function m(n){return '$'+Math.round(n).toLocaleString('es-CL');}
  function fuera(it){return it.grupo&&!it.elegida;}
  function sub(it){return (+it.cant||1)*(+it.precio||0)+(+it.despacho||0);} // incluye despacho
  function urlOk(u){return /^https?:\/\//i.test(String(u||'').trim());}
  function est(it){return it.estado||'Por revisar';}
  // Aviso abajo; si trae una accion, muestra "Deshacer" por 6 segundos
  function toast(t,deshacer){
    var x=document.getElementById('toast'); x.innerHTML=''; var s=document.createElement('span'); s.textContent=t; x.appendChild(s);
    if(deshacer){var b=document.createElement('button');b.textContent='Deshacer';b.onclick=function(){x.style.display='none';deshacer();};x.appendChild(b);}
    x.style.display='flex'; clearTimeout(x._t); x._t=setTimeout(function(){x.style.display='none';},deshacer?6000:2600);
  }

  function cargar(){
    if(!S&&!/^[A-Za-z0-9_-]{20,64}$/.test(K)){mensaje('Link incompleto','Revisa que copiaste el link completo que te envió Estudio Bianco.');return;}
    leer().then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      if(x.j&&(x.j.pin||x.j.bloqueado)){if(PIN&&x.j.pin){PIN='';try{localStorage.removeItem('ebc_pin_'+S);}catch(e){}}pedirClave(x.j.error||'',!!x.j.bloqueado);return;}
      if(!x.ok||!x.j.ok){mensaje('No pudimos abrir el proyecto',x.j.error||'Intenta de nuevo en un momento.');return;}
      D=normalizar(x.j);if(miNombre()){pintar();registrarVisita();}else bienvenida();})
    .catch(function(){mensaje('Sin conexión','Revisa tu internet e intenta de nuevo.');});
  }
  // Clave de 4 números (solo en el link con nombre). Se recuerda en este equipo.
  function pedirClave(err,bloq){
    document.getElementById('app').innerHTML='<div class="bienv"><div class="priv" style="border:0;justify-content:center;margin-bottom:28px;"><span>Plataforma privada · Estudio Bianco®</span></div>'
      +'<img class="logo" src="/logo-estudio-bianco-t.png" alt="Estudio Bianco®" style="margin:0 auto 18px;"><div class="ln"></div><div class="eyebrow" style="text-align:center;">Tu proyecto</div>'
      +'<h1 style="text-align:center;margin-bottom:8px;">¡Te damos la bienvenida a tu portal de cliente!</h1>'
      +'<p style="text-align:center;color:var(--tx2);font-size:15px;margin:0 0 22px;">Nos alegra verte acá.</p>'
      +'<label for="bPin">Clave de 4 números que te dio Estudio Bianco</label><input id="bPin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••" style="text-align:center;letter-spacing:.5em;font-size:22px;"'+(bloq?' disabled':'')+' onkeydown="if(event.key===\'Enter\')ebClave()">'
      +'<div class="err" id="bErr"'+(err?' style="display:block;"':'')+'>'+e(err)+'</div><button onclick="ebClave()"'+(bloq?' disabled style="opacity:.5;"':'')+'>Entrar</button>'
      +'<p>Si no tienes la clave, pídesela a Estudio Bianco.</p></div>';
    setTimeout(function(){var i=document.getElementById('bPin');if(i&&!bloq)i.focus();},50);
  }
  window.ebClave=function(){
    var v=(document.getElementById('bPin').value||'').replace(/\D/g,'');
    if(v.length!==4){var er=document.getElementById('bErr');er.textContent='La clave tiene 4 números.';er.style.display='block';return;}
    PIN=v; try{localStorage.setItem('ebc_pin_'+S,v);}catch(x){} cargar();
  };
  // Bienvenida: el nombre se pide una sola vez al entrar y queda constancia de cada ingreso
  function bienvenida(){
    colorProyecto();
    document.getElementById('app').innerHTML='<div class="bienv"><div class="priv" style="border:0;justify-content:center;margin-bottom:28px;"><span>Plataforma privada · Estudio Bianco®</span></div>'
      +'<img class="logo" src="/logo-estudio-bianco-t.png" alt="Estudio Bianco®" style="margin:0 auto 18px;"><div class="ln"></div><div class="eyebrow" style="text-align:center;">Te damos la bienvenida</div>'
      +'<h1 style="text-align:center;margin-bottom:18px;">'+e(D.proyecto.nombre)+'</h1>'
      +'<label for="bNom">¿Cómo te llamas?</label><input id="bNom" maxlength="80" placeholder="Tu nombre" autocomplete="given-name" onkeydown="if(event.key===\'Enter\')ebEntrar()">'
      +'<div class="err" id="bErr">Escribe tu nombre para entrar.</div><button onclick="ebEntrar()">Entrar</button>'
      +'<p>Lo pedimos solo esta vez, para que el estudio sepa quién revisa el proyecto.</p></div>';
    setTimeout(function(){var i=document.getElementById('bNom');if(i)i.focus();},50);
  }
  window.ebEntrar=function(){
    var n=document.getElementById('bNom').value.trim(); if(!n){document.getElementById('bErr').style.display='block';return;}
    try{localStorage.setItem('ebc_nombre',n);}catch(x){}
    pintar(); window.scrollTo(0,0); registrarVisita();
  };
  function registrarVisita(){
    var k='ebc_vis_'+(K||S); try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');}catch(x){}
    post({accion:'visita',nombre:miNombre()}).catch(function(){});
    setTimeout(avisoAlEntrar,700);
  }
  // ── Novedades desde la última visita (se recuerda en este equipo) ──
  var VK='ebc_ultvis_'+(S||K), NOVPREV='', ETAPAPREV='';
  try{NOVPREV=localStorage.getItem(VK)||'';ETAPAPREV=localStorage.getItem(VK+'_etapa')||'';}catch(x){}
  function novedades(){
    if(!D)return {};
    var prev=NOVPREV.slice(0,10), hoyS=new Date().toLocaleDateString('sv-SE',{timeZone:'America/Santiago'}), sg=D.seguimiento||{};
    var docs=(D.documentos||[]).filter(function(d){return prev&&d.fecha&&d.fecha>prev;});
    var prox=(sg.proximas||[])[0], enDias=prox?Math.round((new Date(prox.fecha+'T12:00:00')-new Date(hoyS+'T12:00:00'))/86400000):99;
    var nomEt={reunion_inicial:'Reunión de consulta',anteproyecto:'Anteproyecto',correccion_1:'Primera corrección',correccion_2:'Segunda corrección',entrega_final:'Entrega final',implementacion:'Implementación',cerrado:'Proyecto terminado'};
    return {resp:respNuevas().length, porRev:(D.items||[]).filter(function(it){return est(it)==='Por revisar'&&!fuera(it);}).length,
      lam:docs.filter(function(d){return d.tipo==='lamina';}).length, ren:docs.filter(function(d){return d.tipo==='render';}).length,
      etapa:(ETAPAPREV&&sg.etapa&&sg.etapa!==ETAPAPREV)?(nomEt[sg.etapa]||''):'', reunion:(prox&&enDias>=0&&enDias<=7)?prox:null};
  }
  function guardarVisita(){try{localStorage.setItem(VK,new Date().toISOString());if(D&&D.seguimiento&&D.seguimiento.etapa)localStorage.setItem(VK+'_etapa',D.seguimiento.etapa);}catch(x){}}
  function avisoAlEntrar(){
    var n=novedades(), filas=[];
    if(n.resp)filas.push(['💬','Te respondimos '+(n.resp===1?'un comentario':n.resp+' comentarios'),'Leer',"ebNovCerrar();ebV('compras');setTimeout(function(){var a=document.getElementById('avResp');if(a)a.scrollIntoView({block:'center',behavior:'smooth'});},200)"]);
    if(n.lam)filas.push(['📐',(n.lam===1?'Una lámina nueva':n.lam+' láminas nuevas')+' para revisar','Ver',"ebNovCerrar();ebV('lamina')"]);
    if(n.ren)filas.push(['🖼',(n.ren===1?'Un render nuevo':n.ren+' renders nuevos')+' para revisar','Ver',"ebNovCerrar();ebV('render')"]);
    if(n.etapa)filas.push(['✨','Tu proyecto avanzó a: '+n.etapa,'Ver',"ebNovCerrar();ebV('avance')"]);
    if(n.reunion)filas.push(['📅','Próxima reunión: '+n.reunion.titulo+' · '+fechaLarga(n.reunion.fecha)+(n.reunion.hora?' · '+n.reunion.hora:''),'Ver',"ebNovCerrar();ebV('avance')"]);
    if(n.porRev)filas.push(['✋',n.porRev+' producto'+(n.porRev===1?'':'s')+' esperan tu respuesta','Revisar',"ebNovCerrar();ebF('Por revisar');ebV('compras')"]);
    if(!filas.length){guardarVisita();return;}
    var ov=document.getElementById('novPop'); if(!ov){ov=document.createElement('div');ov.id='novPop';ov.onclick=function(ev){if(ev.target===ov)window.ebNovCerrar();};document.body.appendChild(ov);}
    ov.innerHTML='<div class="np-box"><div class="np-h"><span class="np-bell">🔔</span><div><b>'+(NOVPREV?'Novedades desde tu última visita':'Esto te espera en tu proyecto')+'</b><small>'+e(miNombre()?'Hola '+miNombre()+', ':'')+'esto es lo que hay para ti</small></div></div>'
      +filas.map(function(f){return '<div class="np-f"><span class="np-i">'+f[0]+'</span><span class="np-t">'+e(f[1])+'</span><button onclick="'+f[3]+'">'+f[2]+'</button></div>';}).join('')
      +'<button class="np-ok" onclick="ebNovCerrar()">Entendido</button></div>';
    ov.classList.add('open');
  }
  window.ebNovCerrar=function(){var ov=document.getElementById('novPop');if(ov)ov.classList.remove('open');guardarVisita();};
  // Productos, proveedores, espacios y grupos con mayúscula solo al inicio ("Mesa lateral leblon")
  function cap(s){s=String(s==null?'':s).trim();if(!s)return s;var l=s.toLocaleLowerCase('es');return l.charAt(0).toLocaleUpperCase('es')+l.slice(1);}
  function normalizar(d){(d.items||[]).forEach(function(it){it.item=cap(it.item);it.proveedor=cap(it.proveedor);it.espacio=cap(it.espacio);it.grupo=cap(it.grupo);});(d.proveedores||[]).forEach(function(p){p.nombre=cap(p.nombre);});return d;}
  // Color del proyecto (projects.color) como acento del portal; si no viene, el verde del estudio
  function colorProyecto(){
    var c=String((D&&D.proyecto&&D.proyecto.color)||'').trim(); if(!/^#[0-9a-f]{6}$/i.test(c))c='#2A5C45';
    var n=parseInt(c.slice(1),16), rgb=(n>>16&255)+','+(n>>8&255)+','+(n&255);
    document.documentElement.style.setProperty('--ac',c); document.documentElement.style.setProperty('--acs','rgba('+rgb+',.12)');
  }
  function mensaje(t,p){document.getElementById('app').innerHTML='<div class="msg"><img class="logo" src="/logo-estudio-bianco-t.png" alt="Estudio Bianco" style="margin:0 auto 24px;"><h1>'+e(t)+'</h1><p>'+e(p)+'</p></div>';}

  function pintar(){
    var its=D.items, sumable=function(it){return !fuera(it)&&est(it)!=='Rechazado';};
    var total=its.reduce(function(a,it){return a+(sumable(it)?sub(it):0);},0), pagado=its.reduce(function(a,it){return a+(sumable(it)?Math.min(+it.pagado||0,sub(it)):0);},0);
    var cuenta={'':its.length,'Por revisar':0,'Aprobado':0,'Cambios solicitados':0,'Rechazado':0};
    its.forEach(function(it){cuenta[est(it)]=(cuenta[est(it)]||0)+1;});
    var porCotizar=its.some(function(it){return !fuera(it)&&!(+it.precio>0);});
    document.title=(D.proyecto.nombre||'Tu proyecto')+' · Estudio Bianco';
    var docs=D.documentos||[], nLam=docs.filter(function(d){return d.tipo==='lamina';}).length, nRen=docs.filter(function(d){return d.tipo==='render';}).length, nCot=docs.filter(function(d){return d.tipo==='cotizacion';}).length, nProv=(D.proveedores||[]).length;
    if((vista==='lamina'&&!nLam)||(vista==='render'&&!nRen)||(vista==='cotizacion'&&!nCot)||(vista==='prov'&&!nProv))vista='compras';
    if(vista==='avance'&&!D.seguimiento)vista='compras';
    // Cabecera calma: logo chico y portada con el último render del proyecto (como la pantalla "Proyecto" de la app)
    colorProyecto();
    // Portada: la que elige el estudio (projects.portada); si no hay, el último render
    var foto=D.proyecto.portada?{url:D.proyecto.portada}:docs.filter(function(d){return d.tipo==='render'&&!d.pdf&&/supabase\.co\//i.test(d.url||'');}).slice(-1)[0];
    var h='<div class="top"><img class="logo" src="/logo-estudio-bianco-t.png" alt="Estudio Bianco®"><span class="priv-t">Plataforma privada</span></div>'
      +'<div class="portada ancha">'+(foto?'<img src="'+e(foto.url)+'" alt="">':'')+'<div class="velo"></div><div class="texto"><h1>'+e(D.proyecto.nombre)+'</h1>'+(D.proyecto.cliente||D.proyecto.direccion?'<span class="cli">'+[D.proyecto.cliente,D.proyecto.direccion].filter(Boolean).map(e).join(' · ')+'</span>':'')+'</div></div>';
    var nom=miNombre();
    h+='<div class="hola"><h2>Hola'+(nom?', '+e(nom.split(' ')[0]):'')+'</h2>'+(nom?'<span>Respondes como '+e(nom)+' · <a href="#" onclick="ebCambiarNombre();return false;">cambiar</a></span>':'')+'</div>';
    // Punto rojo en la pestaña donde hay algo nuevo para el cliente
    var nv=novedades();
    function tab(v,t,n){var dot=(v==='compras'&&(nv.resp||nv.porRev))||(v==='lamina'&&(nv.lam||nv.ren))||(v==='avance'&&(nv.etapa||nv.reunion));return '<button class="'+(vista===v?'on':'')+'" onclick="ebV(\''+v+'\')">'+t+(n!=null?' <i>'+n+'</i>':'')+(dot&&vista!==v&&!tabVisto[v]?'<span class="tab-dot" title="Hay novedades"></span>':'')+'</button>';}
    // Planos, láminas, looks y renders van juntos en una sola pestaña
    if(vista==='render')vista='lamina';
    if(vista==='lamina'&&!nLam&&!nRen)vista='compras';
    h+='<div class="tabs">'+tab('compras','Listado de compras')+(D.seguimiento?tab('avance','Cómo va tu proyecto'):'')+(nLam||nRen?tab('lamina','Planos y renders',nLam+nRen):'')+(nCot?tab('cotizacion','Cotizaciones',nCot):'')+(nProv?tab('prov','Agenda proveedores',nProv):'')+'</div>';
    var pie='<footer><b>Estudio Bianco®</b> · Plataforma de gestión de proyectos de diseño y desarrollo exclusivo de Estudio Bianco.<br>Estudio Bianco es una marca registrada. Este contenido es confidencial y de uso exclusivo del cliente; prohibida su reproducción total o parcial.</footer>';
    if(vista==='avance'){h+=htmlAvance()+pie;document.getElementById('app').innerHTML=h;barra(false);return;}
    if(vista==='prov'){h+=htmlProveedores()+pie;document.getElementById('app').innerHTML=h;barra(false);return;}
    if(vista==='lamina'){h+=(nLam?(nRen?'<h2 class="sec-t" style="margin-top:4px;">Planos y láminas</h2>':'')+htmlDocs('lamina'):'')+(nRen?(nLam?'<h2 class="sec-t" style="margin-top:26px;">Looks y renders</h2>':'')+htmlDocs('render'):'')+pie;document.getElementById('app').innerHTML=h;barra(false);return;}
    if(vista==='cotizacion'){h+=htmlDocs(vista)+pie;document.getElementById('app').innerHTML=h;barra(false);return;}
    h+='<div class="intro"><div class="imp"><b>Ojo</b>Este listado puede estar incompleto: se va ajustando según nuestras reuniones. Aun así, es una aproximación fiel al presupuesto total.</div></div>';
    var revisados=its.length-(cuenta['Por revisar']||0), pct=its.length?Math.round(revisados/its.length*100):0;
    var pctP=total>0?Math.round(pagado/total*100):0;
    h+=avisoRespuestas();
    h+='<div class="tot3"><div><div class="l">Presupuesto total</div><div class="v">'+m(total)+'</div></div><div><div class="l">Pagado</div><div class="v ok">'+m(pagado)+'</div></div><div><div class="l">Por pagar</div><div class="v">'+m(Math.max(0,total-pagado))+'</div></div><div class="prog" title="'+pctP+'% pagado"><div style="width:'+pctP+'%;background:var(--ok);"></div></div></div>';
    h+='<p class="meta" style="margin:0 6px;">'+cuenta['Aprobado']+' de '+its.length+' productos aprobados'+(porCotizar?' · algunos productos están por cotizar':'')+'</p>';
    // "Todos" no muestra lo descartado: los descartados se ven solo en su filtro
    cuenta['']=its.length-(cuenta['Rechazado']||0);
    var F=[['','Todos'],['Por revisar','Por revisar'],['Aprobado','Aprobados'],['Cambios solicitados','Con cambios'],['Rechazado','Descartados']];
