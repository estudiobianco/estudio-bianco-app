<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tu proyecto · Estudio Bianco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--az:#2F78A8;--azl:#E6F2FA;--azb:#BCDCEF;--surface:#fff;--s2:#F1EEE7;--tx:#2A2824;--tx2:#6B665E;--tx3:#A8A29A;--bd:#E5E1D8;--bd2:#D6D0C4;--ac:#2A5C45;--acl:#E7EFE9;--ok:#2F8663;--okl:#E4F2EA;--wn:#B8791F;--wnl:#FBF1E1;--dn:#B4483C;--dnl:#F8E7E4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding-bottom:20px;margin-bottom:22px;}
.logo{height:40px;display:block;margin-bottom:18px;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--az);font-weight:700;margin-bottom:6px;}
h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:32px;line-height:1.1;}
.sub{color:var(--tx2);margin-top:6px;max-width:560px;}
.tot{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.tot .s{text-align:right;}
.tot .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);}
.tot .v{font-family:'Fraunces',Georgia,serif;font-size:26px;margin-top:2px;}
.tot .s{font-size:12px;color:var(--tx2);}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
.chip{border:1px solid var(--bd);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--tx);font-family:inherit;}
.chip i{font-style:normal;color:var(--tx3);margin-left:5px;}
.chip.on{background:var(--az);border-color:var(--az);color:#fff;}.chip.on i{color:rgba(255,255,255,.75);}
.sp{flex:1;}
select.ag{border:1px solid var(--bd);background:var(--surface);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--tx);}
h2{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:21px;margin:26px 0 12px;display:flex;gap:10px;align-items:baseline;}
h2 small{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--tx3);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.card.alt{opacity:.92;}
.ph{height:220px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:12px;position:relative;}
.ph img{width:100%;height:100%;object-fit:contain;padding:10px;background:#fff;}
.badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--surface);border:1px solid var(--bd);}
.b-Aprobado{background:var(--okl);color:var(--ok);border-color:#BFE0CC;}
.b-Cambios{background:var(--wnl);color:var(--wn);border-color:#EBCF9F;}
.b-Rechazado{background:var(--dnl);color:var(--dn);border-color:#EEC5BE;}
.b-Por{background:var(--surface);color:var(--tx2);}
.bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.opn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--az);}
.card.alt .opn{color:var(--tx3);}
.nm{font-weight:700;font-size:15px;line-height:1.3;}
.meta{font-size:12.5px;color:var(--tx2);}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px;}
.pr .u{font-size:12.5px;color:var(--tx2);}
.pr .t{font-weight:700;font-size:15px;}
.card.alt .pr .t{color:var(--tx3);}
.specs{font-size:12px;color:var(--tx2);white-space:pre-line;background:#F6F6F4;border-radius:8px;padding:8px 10px;max-height:7.5em;overflow:hidden;position:relative;cursor:pointer;}
.specs.open{max-height:none;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;}
.ent{border-radius:99px;padding:2px 9px;background:var(--s2);color:var(--tx2);}
.ent.ok{background:var(--okl);color:var(--ok);}
a.tienda{color:var(--az);font-weight:500;text-decoration:none;font-size:12.5px;}
a.tienda:hover{text-decoration:underline;}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap;}
.acts button{flex:1;min-width:84px;border:1px solid var(--bd2);background:var(--surface);border-radius:10px;padding:9px 6px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--tx);}
.acts button:hover{border-color:var(--az);}
.acts .ap.on{background:var(--ok);border-color:var(--ok);color:#fff;}
.acts .ca.on{background:var(--wn);border-color:var(--wn);color:#fff;}
.acts .re.on{background:var(--dn);border-color:var(--dn);color:#fff;}
.coms{border-top:1px solid var(--bd);padding:10px 16px;background:#FAFAF9;font-size:12.5px;}
.com{margin-bottom:6px;}.com b{font-weight:700;}.com .f{color:var(--tx3);font-size:11px;margin-left:4px;}
.addc{background:none;border:0;color:var(--tx2);font-size:12.5px;cursor:pointer;padding:0;font-family:inherit;text-decoration:underline;}
.grp{background:#F7FBFE;border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;}
.grp .gh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin:0 2px 12px;}
.grp .gh b{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:18px;}
.grp .gh span{font-size:12.5px;color:var(--tx2);}

.grp .card{border-color:var(--bd);}
.grp .card.sel{border:2px solid var(--az);}
.msg{text-align:center;padding:80px 20px;color:var(--tx2);}
.msg h1{margin-bottom:10px;}
.modal{position:fixed;inset:0;background:rgba(30,28,24,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal.open{display:flex;}
.box{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:22px;}
.box h3{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:21px;margin-bottom:4px;}
.box p{color:var(--tx2);font-size:13px;margin-bottom:12px;}
.box label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px;}
.box input,.box textarea{width:100%;border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--tx);}
.box textarea{min-height:96px;resize:vertical;}
.box .err{color:var(--dn);font-size:12.5px;margin-top:8px;display:none;}
.box .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.box .bt button{border:1px solid var(--bd2);background:var(--surface);border-radius:10px;padding:9px 16px;font-family:inherit;font-size:14px;cursor:pointer;}
.box .bt .p{background:var(--az);border-color:var(--az);color:#fff;font-weight:500;}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f2a24;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;display:none;z-index:60;}
/* Intro */
.intro{margin-bottom:12px;}
.ins{background:var(--azl);border:1px solid var(--azb);border-radius:12px;padding:12px 16px;font-size:13px;color:#1F4C6B;}
.ins b{font-weight:700;}
.ins ol{margin:8px 0 0 18px;padding:0;}.ins li{margin-bottom:4px;}
.imp{background:#FDECEA;border:1px solid #F1B8B0;border-radius:12px;padding:12px 16px;font-size:13px;color:#9B2C1F;}
.imp b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
@media (max-width:760px){.intro{grid-template-columns:1fr;}}
.prog{flex-basis:100%;height:6px;background:#EEF1F3;border-radius:99px;overflow:hidden;}
.prog div{height:100%;background:var(--az);border-radius:99px;transition:width .3s;}
.toast{align-items:center;gap:12px;}
.toast button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;font-family:inherit;font-size:13px;cursor:pointer;}
.notab{align-self:flex-start;border:1px solid var(--azb);background:var(--azl);color:#1F4C6B;border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit;}
.nota{display:none;background:var(--azl);border-radius:8px;padding:8px 10px;font-size:12.5px;color:#1F4C6B;white-space:pre-line;}
.compra{font-size:12px;color:var(--ok);background:var(--okl);border-radius:8px;padding:6px 10px;}
.compra a{color:var(--ok);margin-left:4px;}
.lcy{align-self:flex-start;border:0;background:none;color:var(--tx2);font-size:12.5px;cursor:pointer;padding:0;font-family:inherit;text-decoration:underline;}
.fin{margin-top:30px;background:var(--azl);border:1px solid var(--azb);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:#1F4C6B;font-size:13.5px;}
.fin span{font-size:12.5px;}
.fin button{background:var(--az);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
.res{max-height:50vh;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13px;}
.res h4{font-size:13px;margin:10px 0 4px;}.res ul{margin:0 0 0 18px;}.res p{margin-bottom:6px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:0 0 16px;}
.tabs button{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--tx2);cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs button.on{color:var(--az);border-bottom-color:var(--az);font-weight:500;}
.tabs i{font-style:normal;font-size:12px;color:var(--tx3);}
.card.prov .pc{display:flex;flex-direction:column;gap:4px;font-size:13px;margin-top:6px;}
.card.prov .pc a{color:var(--az);text-decoration:none;}
.card.prov .pc a:hover{text-decoration:underline;}
footer{margin-top:40px;color:var(--tx3);font-size:12px;text-align:center;}
@media (max-width:600px){h1{font-size:26px;}.tot .s{text-align:left;}.grid,.grp .grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Cargando tu proyecto…</div></div>

<div class="modal" id="modal"><div class="box">
  <h3 id="mT"></h3><p id="mP"></p>
  <label for="mNom" id="mNL">Tu nombre</label><input id="mNom" maxlength="80" placeholder="Ej: Jorge">
  <label for="mCom" id="mCL">Comentario</label><textarea id="mCom" maxlength="2000" placeholder="Escribe aquí…"></textarea>
  <div class="err" id="mErr"></div>
  <div class="bt"><button onclick="cerrar()">Cancelar</button><button class="p" id="mOk" onclick="enviar()">Enviar</button></div>
</div></div>
<div class="modal" id="resOv"><div class="box"><div class="cuerpo"></div><div class="bt"><button onclick="ebCerrarRes()">Cerrar</button><button class="p" onclick="ebGuardarResumen()">Guardar o imprimir</button></div></div></div>
<div class="modal" id="compOv"><div class="box cuerpo"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var K=new URLSearchParams(location.search).get('k')||'';
  var D=null, filtro='', agrupar='esp', pend=null;
  try{agrupar=localStorage.getItem('ebc_agrupar')||'esp';}catch(e){}
  var vista='compras'; try{vista=localStorage.getItem('ebc_vista')==='prov'?'prov':'compras';}catch(e){}
  function e(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function m(n){return '$'+Math.round(n).toLocaleString('es-CL');}
  function fuera(it){return it.grupo&&!it.elegida;}
  function sub(it){return (+it.cant||1)*(+it.precio||0);}
  function urlOk(u){return /^https?:\/\//i.test(String(u||'').trim());}
  function est(it){return it.estado||'Por revisar';}
  // Aviso abajo; si trae una accion, muestra "Deshacer" por 6 segundos
  function toast(t,deshacer){
    var x=document.getElementById('toast'); x.innerHTML=''; var s=document.createElement('span'); s.textContent=t; x.appendChild(s);
    if(deshacer){var b=document.createElement('button');b.textContent='Deshacer';b.onclick=function(){x.style.display='none';deshacer();};x.appendChild(b);}
    x.style.display='flex'; clearTimeout(x._t); x._t=setTimeout(function(){x.style.display='none';},deshacer?6000:2600);
  }

  function cargar(){
    if(!/^[A-Za-z0-9_-]{20,64}$/.test(K)){mensaje('Link incompleto','Revisa que copiaste el link completo que te envió Estudio Bianco.');return;}
    fetch('/api/cliente?k='+encodeURIComponent(K)).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){if(!x.ok||!x.j.ok){mensaje('No pudimos abrir el proyecto',x.j.error||'Intenta de nuevo en un momento.');return;}D=x.j;pintar();})
    .catch(function(){mensaje('Sin conexión','Revisa tu internet e intenta de nuevo.');});
  }
  function mensaje(t,p){document.getElementById('app').innerHTML='<div class="msg"><img class="logo" src="/logo-estudio-bianco.png" alt="Estudio Bianco" style="margin:0 auto 24px;"><h1>'+e(t)+'</h1><p>'+e(p)+'</p></div>';}

  function pintar(){
    var its=D.items, total=its.reduce(function(a,it){return a+(fuera(it)?0:sub(it));},0);
    var cuenta={'':its.length,'Por revisar':0,'Aprobado':0,'Cambios solicitados':0,'Rechazado':0};
    its.forEach(function(it){cuenta[est(it)]=(cuenta[est(it)]||0)+1;});
    var porCotizar=its.some(function(it){return !fuera(it)&&!(+it.precio>0);});
    document.title=(D.proyecto.nombre||'Tu proyecto')+' · Estudio Bianco';
    var h='<header><div><img class="logo" src="/logo-estudio-bianco.png" alt="Estudio Bianco"><div class="eyebrow">Listado de compras</div><h1>'+e(D.proyecto.nombre)+'</h1>'
      +'<p class="sub">Esta aplicación es de desarrollo exclusivo de Estudio Bianco, una herramienta para administrar tu proyecto. Aquí armamos tu listado de compras y revisamos contigo cada producto antes de pagarlo.</p></div></header>';
    h+='<div class="intro"><div class="imp"><b>Importante</b>Este listado puede estar incompleto: se va ajustando según nuestras reuniones. Aun así, es una aproximación fiel al presupuesto total.</div></div>';
    var nProv=(D.proveedores||[]).length;
    h+='<div class="tabs"><button class="'+(vista==='compras'?'on':'')+'" onclick="ebV(\'compras\')">Listado de compras</button>'+(nProv?'<button class="'+(vista==='prov'?'on':'')+'" onclick="ebV(\'prov\')">Proveedores <i>'+nProv+'</i></button>':'')+'</div>';
    if(vista==='prov'){h+=htmlProveedores();h+='<footer>Estudio Bianco · Este link es solo para ti. Si tienes dudas, escríbenos.</footer>';document.getElementById('app').innerHTML=h;return;}
    var revisados=its.length-(cuenta['Por revisar']||0), pct=its.length?Math.round(revisados/its.length*100):0, nom=miNombre();
    h+='<div class="tot"><div><div class="l">Total con lo elegido</div><div class="v">'+m(total)+'</div></div><div class="s">Has revisado <b>'+revisados+' de '+its.length+'</b> productos'+(porCotizar?'<br>Algunos productos están por cotizar':'')
      +(nom?'<br><span style="color:var(--tx3);">Respondiendo como '+e(nom)+' · <a href="#" onclick="ebCambiarNombre();return false;" style="color:var(--az);">cambiar</a></span>':'')+'</div>'
      +'<div class="prog"><div style="width:'+pct+'%;"></div></div></div>';
    var F=[['','Todos'],['Por revisar','Por revisar'],['Aprobado','Aprobados'],['Cambios solicitados','Con cambios'],['Rechazado','Descartados']];
    h+='<div class="bar">'+F.map(function(f){return '<button class="chip'+(filtro===f[0]?' on':'')+'" onclick="ebF(\''+f[0]+'\')">'+f[1]+'<i>'+(cuenta[f[0]]||0)+'</i></button>';}).join('')
      +'<span class="sp"></span><select class="ag" onchange="ebA(this.value)"><option value="esp"'+(agrupar==='esp'?' selected':'')+'>Ver por espacio</option><option value="cat"'+(agrupar==='cat'?' selected':'')+'>Ver por categoría</option></select></div>';
    var lista=its.filter(function(it){return !filtro||est(it)===filtro;});
    if(!lista.length)h+='<div class="msg" style="padding:40px;">No hay productos en este filtro.</div>';
    var secs={}, orden=[];
    lista.forEach(function(it){var s=agrupar==='esp'?(it.espacio||'Otros'):(it.cat||'Otros');if(!secs[s]){secs[s]=[];orden.push(s);}secs[s].push(it);});
    if(agrupar==='esp')orden.sort(function(a,b){return (a==='Otros')-(b==='Otros')||a.localeCompare(b,'es');});
    orden.forEach(function(s){
      var arr=secs[s];
      h+='<h2>'+e(s)+'<small>'+arr.length+' producto'+(arr.length===1?'':'s')+'</small></h2>';
      var sueltos=[], hechos={}, bloques=[];
      arr.forEach(function(it){
        if(!it.grupo){bloques.push({tipo:'s',it:it});return;}
        if(hechos[it.grupo])return; hechos[it.grupo]=1;
        bloques.push({tipo:'g',g:it.grupo,its:arr.filter(function(x){return x.grupo===it.grupo;})});
      });
      var buf=[];
      function vaciar(){if(buf.length){h+='<div class="grid">'+buf.join('')+'</div>';buf=[];}}
      bloques.forEach(function(b){
        if(b.tipo==='s'){buf.push(tarjeta(b.it));return;}
        vaciar();
        var todos=its.filter(function(x){return x.grupo===b.g;});
        h+='<div class="grp"><div class="gh"><b>'+e(b.g)+'</b><span>Elige una de '+todos.length+' opciones · el total incluye la que tiene el borde celeste</span></div><div class="grid">'
          +b.its.map(function(it){return tarjeta(it,todos.indexOf(it)+1);}).join('')+'</div></div>';
      });
      vaciar();
    });
    h+='<div class="fin"><div><b>¿Terminaste de revisar?</b><br><span>Avísanos y te mostramos un resumen de tus respuestas para que lo guardes. Puedes seguir cambiando respuestas después.</span></div><button id="finBtn" onclick="ebFin()">Terminé de revisar</button></div>';
    h+='<footer>Estudio Bianco · Este link es solo para ti. Si tienes dudas, escríbenos.</footer>';
    document.getElementById('app').innerHTML=h;
  }
  function tarjeta(it,nOp){
    var es_=est(it), cls=es_.split(' ')[0];
    var r=(D.respuestas||[]).filter(function(x){return x.itemId===it.id;}).slice(0,6).reverse();
    var h='<div class="card'+(it.grupo?(it.elegida?' sel':' alt'):'')+'"><div class="ph">'+(it.imagen?'<img src="'+e(it.imagen)+'" alt="" loading="lazy">':'Sin imagen')
      +'<span class="badge b-'+e(cls)+'">'+(es_==='Aprobado'?'✓ Aprobado':es_==='Rechazado'?'Descartado':es_==='Cambios solicitados'?'Cambios pedidos':'Por revisar')+'</span></div><div class="bd">';
    if(nOp)h+='<div class="opn">Opción '+nOp+(it.elegida?' · incluida en el total':' · alternativa')+'</div>';
    h+='<div class="nm">'+e(it.item)+'</div><div class="meta">'+[it.proveedor,it.espacio].filter(Boolean).map(e).join(' · ')+'</div>';
    h+='<div class="pr"><span class="u">'+(it.cant>1?it.cant+' × ':'')+(+it.precio>0?m(it.precio):'Por cotizar')+'</span><span class="t">'+(+it.precio>0?m(sub(it)):'')+'</span></div>';
    if((it.specs||'').trim())h+='<div class="specs" onclick="this.classList.toggle(\'open\')" title="Ver más">'+e(it.specs)+'</div>';
    if((it.nota||'').trim())h+='<button class="notab" onclick="ebNota(this)">💬 Nota del estudio</button><div class="nota">'+e(it.nota)+'</div>';
    h+='<div class="row"><span class="ent'+(it.entrega==='Entregado'?' ok':'')+'">'+e(it.entrega||'Por pedir')+'</span>'+(urlOk(it.link)?'<a class="tienda" href="'+e(it.link)+'" target="_blank" rel="noopener">Ver en tienda ↗</a>':'')+'</div>';
    if(it.compra&&it.compra.fecha)h+='<div class="compra">🛒 '+(it.compra.por==='cliente'?'Lo compraste':'Comprado')+' el '+e(fechaCorta(it.compra.fecha))+(it.compra.entrega?' · entrega aprox. '+e(fechaCorta(it.compra.entrega)):'')+' <a href="#" onclick="ebCompra('+it.id+');return false;">editar</a></div>';
    else if(it.entrega!=='Entregado')h+='<button class="lcy" onclick="ebCompra('+it.id+')">🛒 Lo compré yo</button>';
    h+='<div class="acts"><button class="ap'+(es_==='Aprobado'?' on':'')+'" onclick="ebR('+it.id+',\'Aprobado\')">✓ Apruebo</button><button class="ca'+(es_==='Cambios solicitados'?' on':'')+'" onclick="ebR('+it.id+',\'Cambios solicitados\')">✎ Cambios</button><button class="re'+(es_==='Rechazado'?' on':'')+'" onclick="ebR('+it.id+',\'Rechazado\')">✕ Descartar</button></div></div>';
    h+='<div class="coms">'+r.map(function(c){return '<div class="com"><b>'+e(c.nombre)+'</b>'+(c.decision?' · '+e(c.decision==='Rechazado'?'Descartado':c.decision):'')+'<span class="f">'+e(c.fecha)+'</span>'+(c.comentario?'<div>'+e(c.comentario)+'</div>':'')+'</div>';}).join('')
      +'<button class="addc" onclick="ebR('+it.id+',\'\')">Dejar un comentario</button></div></div>';
    return h;
  }
  window.ebV=function(v){vista=v;try{localStorage.setItem('ebc_vista',v);}catch(x){}pintar();window.scrollTo(0,0);};
  function htmlProveedores(){
    var ps=D.proveedores||[];
    return '<p class="sub" style="margin:0 0 14px;">Las tiendas y proveedores de los productos de tu proyecto, con sus datos de contacto.</p><div class="grid">'+ps.map(function(p){
      var web=(p.web||'').trim(), wurl=web?(/^https?:\/\//i.test(web)?web:'https://'+web):'';
      return '<div class="card prov"><div class="bd"><div class="nm">'+e(p.nombre)+'</div><div class="meta">'+[p.rubro,p.especialidad].filter(Boolean).map(e).join(' · ')+'</div>'
        +'<div class="meta">'+p.productos+' producto'+(p.productos===1?'':'s')+' en tu proyecto</div><div class="pc">'
        +(p.telefono?'<a href="tel:'+e(p.telefono.replace(/[^\d+]/g,''))+'">☎ '+e(p.telefono)+'</a>':'')
        +(p.correo?'<a href="mailto:'+e(p.correo)+'">✉ '+e(p.correo)+'</a>':'')
        +(wurl?'<a href="'+e(wurl)+'" target="_blank" rel="noopener">↗ '+e(web.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,''))+'</a>':'')
        +((p.direccion||p.ciudad)?'<span>⌖ '+e(p.direccion||p.ciudad)+'</span>':'')
        +(!p.telefono&&!p.correo&&!wurl&&!p.direccion&&!p.ciudad?'<span style="color:var(--tx3);">Sin datos de contacto</span>':'')+'</div></div></div>';
    }).join('')+'</div>';
  }
  window.ebF=function(f){filtro=f;pintar();};
  window.ebA=function(a){agrupar=a;try{localStorage.setItem('ebc_agrupar',a);}catch(x){}pintar();};
  function miNombre(){try{return localStorage.getItem('ebc_nombre')||'';}catch(x){return '';}}
  function nombrePara(fn){var n=miNombre();if(n){fn(n);return;}abrirModal('nombre',null,'',fn);}
  window.ebCambiarNombre=function(){abrirModal('nombre',null,'',function(){pintar();});};
  function post(cuerpo){return fetch('/api/cliente',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({k:K},cuerpo))}).then(function(r){return r.json();});}
  function aplicarLocal(it,dec){
    it.estado=dec==='Por revisar'?'':dec;
    if(dec==='Aprobado'&&it.grupo)D.items.forEach(function(x){if(x.grupo===it.grupo)x.elegida=(x===it);});
  }
  // Aprobar y descartar: un clic. Apretar de nuevo el mismo boton deja el producto "Por revisar".
  window.ebR=function(id,dec){
    var it=D.items.find(function(x){return x.id===id;}); if(!it)return;
    if(dec==='Cambios solicitados'||dec===''){abrirModal(dec,it);return;}
    if(est(it)===dec)dec='Por revisar';
    nombrePara(function(nom){rapido(it,dec,nom);});
  };
  function rapido(it,dec,nom){
    var antes={estado:it.estado,eleg:D.items.filter(function(x){return it.grupo&&x.grupo===it.grupo;}).map(function(x){return [x,x.elegida];})};
    aplicarLocal(it,dec); pintar();
    var txt=dec==='Aprobado'?'✓ Aprobaste '+it.item:dec==='Rechazado'?'Descartaste '+it.item:'Volvió a "Por revisar": '+it.item;
    toast(txt,function(){deshacer(it,antes,nom);});
    post({itemId:it.id,decision:dec,comentario:'',nombre:nom}).then(function(j){if(!j.ok){restaurar(it,antes);toast(j.error||'No se pudo guardar. Intenta de nuevo.');}else refrescar();})
    .catch(function(){restaurar(it,antes);toast('Sin conexión: tu respuesta no se guardó.');});
  }
  function restaurar(it,antes){it.estado=antes.estado;antes.eleg.forEach(function(p){p[0].elegida=p[1];});pintar();}
  function deshacer(it,antes,nom){
    var prev=antes.estado||'Por revisar';
    restaurar(it,antes);
    post({itemId:it.id,decision:prev,comentario:'',nombre:nom}).then(function(){refrescar();});
    toast('Respuesta deshecha');
  }
  var _rt=null; function refrescar(){clearTimeout(_rt);_rt=setTimeout(function(){fetch('/api/cliente?k='+encodeURIComponent(K)).then(function(r){return r.json();}).then(function(j){if(j.ok){D=j;pintar();}}).catch(function(){});},1500);}

  // Ventana: nombre (una sola vez), pedir cambios o comentar
  var modo=null, alListo=null;
  function abrirModal(m,it,_,listo){
    modo=m; pend=it?{id:it.id,dec:m}:null; alListo=listo||null;
    var n=miNombre(), T={'nombre':['¿Cómo te llamas?','Lo pedimos una sola vez, para que el estudio sepa quién responde.'],'Cambios solicitados':['Pedir un cambio','Cuéntanos qué te gustaría cambiar (color, medida, otra opción…).'],'':['Dejar un comentario','Tu comentario le llega al estudio.']}[m];
    document.getElementById('mT').textContent=T[0]; document.getElementById('mP').textContent=(it?it.item+' · ':'')+T[1];
    var conNom=(m==='nombre'||!n);
    document.getElementById('mNom').style.display=document.getElementById('mNL').style.display=conNom?'':'none';
    document.getElementById('mCom').style.display=document.getElementById('mCL').style.display=(m==='nombre')?'none':'';
    document.getElementById('mNom').value=n; document.getElementById('mCom').value=''; document.getElementById('mErr').style.display='none';
    document.getElementById('mOk').textContent=m==='nombre'?'Continuar':'Enviar';
    document.getElementById('modal').classList.add('open');
    setTimeout(function(){(conNom?document.getElementById('mNom'):document.getElementById('mCom')).focus();},50);
  }
  window.cerrar=function(){document.getElementById('modal').classList.remove('open');pend=null;modo=null;alListo=null;};
  window.enviar=function(){
    var nomEl=document.getElementById('mNom'), nom=(nomEl.style.display==='none'?miNombre():nomEl.value.trim()), com=document.getElementById('mCom').value.trim(), err=document.getElementById('mErr');
    function falla(t){err.textContent=t;err.style.display='block';}
    if(!nom)return falla('Escribe tu nombre para que sepamos quién responde.');
    try{localStorage.setItem('ebc_nombre',nom);}catch(x){}
    if(modo==='nombre'){var fn=alListo;cerrar();if(fn)fn(nom);return;}
    if(!com)return falla(modo===''?'Escribe tu comentario.':'Cuéntanos qué cambio quieres.');
    var b=document.getElementById('mOk'); b.disabled=true; b.textContent='Enviando…';
    var p=pend;
    post({itemId:p.id,decision:p.dec,comentario:com,nombre:nom}).then(function(j){
      b.disabled=false; b.textContent='Enviar';
      if(!j.ok)return falla(j.error||'No se pudo enviar.');
      var it=D.items.find(function(x){return x.id===p.id;}); if(it&&p.dec)aplicarLocal(it,p.dec);
      cerrar(); toast('✓ Gracias, quedó registrado'); pintar(); refrescar();
    }).catch(function(){b.disabled=false;b.textContent='Enviar';falla('Sin conexión. Intenta de nuevo.');});
  };

  // "Terminé de revisar": avisa al estudio y muestra un resumen que el cliente puede guardar
  window.ebFin=function(){
    nombrePara(function(nom){
      var b=document.getElementById('finBtn'); if(b){b.disabled=true;b.textContent='Enviando…';}
      post({accion:'fin',nombre:nom}).then(function(j){
        if(b){b.disabled=false;b.textContent='Terminé de revisar';}
        if(!j.ok){toast(j.error||'No se pudo enviar.');return;}
        mostrarResumen(nom,j.fecha);
      }).catch(function(){if(b){b.disabled=false;b.textContent='Terminé de revisar';}toast('Sin conexión. Intenta de nuevo.');});
    });
  };
  function grupoLista(t,arr){return arr.length?'<h4>'+t+' ('+arr.length+')</h4><ul>'+arr.map(function(it){return '<li>'+e(it.item)+(+it.precio>0?' · '+m(sub(it)):'')+'</li>';}).join('')+'</ul>':'';}
  function mostrarResumen(nom,fecha){
    var its=D.items, by=function(s){return its.filter(function(it){return est(it)===s;});};
    var total=its.reduce(function(a,it){return a+(fuera(it)?0:sub(it));},0);
    var cuerpo='<p><b>'+e(D.proyecto.nombre)+'</b><br>Revisado por '+e(nom)+' el '+e(fecha||'')+'</p>'
      +'<p>Total con lo elegido: <b>'+m(total)+'</b></p>'
      +grupoLista('Aprobados',by('Aprobado'))+grupoLista('Con cambios pedidos',by('Cambios solicitados'))+grupoLista('Descartados',by('Rechazado'))+grupoLista('Sin responder',by('Por revisar'));
    window.__resumenHTML=cuerpo;
    var ov=document.getElementById('resOv');
    ov.querySelector('.cuerpo').innerHTML='<h3>¡Gracias, '+e(nom)+'!</h3><p style="color:var(--tx2);font-size:13px;">Le avisamos al estudio que terminaste. Este es el resumen de tu revisión: guárdalo por si lo necesitas. Si te equivocaste en algo, puedes cambiar tu respuesta cuando quieras.</p><div class="res">'+cuerpo+'</div>';
    ov.classList.add('open');
  }
  window.ebGuardarResumen=function(){
    var w=window.open('','_blank'); if(!w){window.print();return;}
    w.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Resumen de revisión · Estudio Bianco</title><style>body{font-family:Helvetica,Arial,sans-serif;color:#2A2824;padding:32px;max-width:720px;margin:auto;font-size:13px;}img{height:36px;}h4{margin:16px 0 4px;font-size:13px;}ul{margin:0 0 0 18px;padding:0;}li{margin:2px 0;}</style></head><body><img src="'+location.origin+'/logo-estudio-bianco.png" alt="Estudio Bianco"><h2 style="font-family:Georgia,serif;font-weight:400;">Resumen de tu revisión</h2>'+window.__resumenHTML+'</body></html>');
    w.document.close(); setTimeout(function(){w.print();},500);
  };
  window.ebCerrarRes=function(){document.getElementById('resOv').classList.remove('open');};
  window.ebNota=function(btn){var n=btn.nextElementSibling;n.style.display=n.style.display==='block'?'none':'block';};

  // "Lo compré yo": el cliente registra su compra y la fecha probable de entrega; le llega al estudio para el seguimiento
  window.ebCompra=function(id){
    var it=D.items.find(function(x){return x.id===id;}); if(!it)return;
    nombrePara(function(){
      var ov=document.getElementById('compOv'), hoy=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
      ov.querySelector('.cuerpo').innerHTML='<h3>Registrar tu compra</h3><p style="color:var(--tx2);font-size:13px;margin-bottom:6px;">'+e(it.item)+' · El estudio recibe estos datos para hacer el seguimiento de la entrega.</p>'
        +'<label>¿Cuándo lo compraste?</label><input type="date" id="cFecha" value="'+e(it.compra&&it.compra.fecha||hoy)+'">'
        +'<label>Fecha probable de entrega o despacho (si la sabes)</label><input type="date" id="cEntrega" value="'+e(it.compra&&it.compra.entrega||'')+'">'
        +'<label>N° de orden o boleta (opcional)</label><input id="cOrden" maxlength="60" value="'+e(it.compra&&it.compra.orden||'')+'">'
        +'<label>Comentario (opcional)</label><textarea id="cCom" maxlength="1000" placeholder="Ej: lo compré en la tienda de Talca, me cobraron despacho aparte…"></textarea>'
        +'<div class="err" id="cErr"></div><div class="bt"><button onclick="ebCerrarComp()">Cancelar</button><button class="p" id="cOk" onclick="ebEnviarCompra('+it.id+')">Guardar</button></div>';
      ov.classList.add('open');
    });
  };
  window.ebCerrarComp=function(){document.getElementById('compOv').classList.remove('open');};
  window.ebEnviarCompra=function(id){
    var f=document.getElementById('cFecha').value, en=document.getElementById('cEntrega').value, o=document.getElementById('cOrden').value.trim(), c=document.getElementById('cCom').value.trim(), err=document.getElementById('cErr');
    if(!f){err.textContent='Indica la fecha de compra.';err.style.display='block';return;}
    if(en&&en<f){err.textContent='La entrega no puede ser antes de la compra.';err.style.display='block';return;}
    var b=document.getElementById('cOk'); b.disabled=true; b.textContent='Guardando…';
    post({accion:'compra',itemId:id,fecha:f,entrega:en,orden:o,comentario:c,nombre:miNombre()}).then(function(j){
      b.disabled=false; b.textContent='Guardar';
      if(!j.ok){err.textContent=j.error||'No se pudo guardar.';err.style.display='block';return;}
      var it=D.items.find(function(x){return x.id===id;}); if(it){it.compra={fecha:f,entrega:en,orden:o,por:'cliente'};it.entrega='Pedido confirmado';}
      ebCerrarComp(); pintar(); toast('✓ Compra registrada. ¡Gracias!'); refrescar();
    }).catch(function(){b.disabled=false;b.textContent='Guardar';err.textContent='Sin conexión. Intenta de nuevo.';err.style.display='block';});
  };
  function fechaCorta(d){if(!d)return '';var p=String(d).split('-');return p.length===3?(+p[2])+'/'+(+p[1])+'/'+p[0]:d;}
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')cerrar();});
  cargar();
})();
</script>
</body>
</html>
